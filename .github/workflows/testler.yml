# =============================================================================
# TShift - otomatik test kapisi
#
# NE ISE YARAR
# Bu dosyadan once 39 test ve 7 mimari kurali YALNIZ elle ".\TEST.ps1"
# calistirildiginda kosuyordu. Yani kurallar oneri seviyesindeydi: unutuldugu
# bir gun kirik kod depoya girer ve kimse gormezdi.
#
# Bu dosyayla her "git push" sonrasi testler GitHub'da kendiliginden kosar.
# Kirmizi yanarsa depo sayfasinda kirmizi carpi gorunur.
#
# NEDEN ONEMLI
# Talimat yonlendirir, otomatik kapi zorlar. Bir kural yazidaysa unutulur;
# kapidaysa unutulamaz. 12 Eylul'de tam bunun ornegini yasadik: dokumanda
# "bekci eklendi" yaziyordu, bekci yoktu.
#
# NASIL CALISIR
# 1. Veritabani kutusu ayaga kalkar (db/init betikleri kendiliginden kosar)
# 2. API kutusu TSHIFT_KURULUM=true ile acilir: migration + RLS betikleri +
#    ornek veri. Bu, yerel makinede calisan yolun AYNISI - CI ile yerel
#    arasinda fark olmasin diye bilerek boyle secildi.
# 3. Kurulum bitince API durdurulur (testler kendi uygulamasini ayaga kaldirir)
# 4. dotnet test kosar
#
# IKI AYRI IS (job) VAR - bilerek
#   test   : .NET backend (39 test + mimari kurallari)
#   motor  : Python planlama motoru (60 birim + 12 altin senaryo)
#
#   Ayni ise konsalardi ilkinin kirmizisi ikincinin sonucunu GIZLERDI: bir
#   adim patlayinca sonrakiler hic kosmaz. Ayri isler paralel koser ve depo
#   sayfasinda hangisinin kirildigi tek bakista gorunur.
#
#   Motor isi docker GEREKTIRMEZ: dogrulayici saf standart kutuphane,
#   cozucu yalniz ortools istiyor.
# =============================================================================

name: Testler

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:      # GitHub arayuzunden elle de calistirilabilir

jobs:
  test:
    name: Testler ve mimari kurallari
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Depoyu al
        uses: actions/checkout@v7

      - name: .NET kur
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      # T-34: sirlarin varsayilani YOK. Depoya da yazilmaz, GitHub secret'i
      # da gerekmez -- her kosuda yenisi uretilir. Yan fayda: uygulamanin
      # KEYFI bir degerle calistigi da boylece kanitlanmis olur.
      - name: Test sirlarini uret
        run: |
          echo "DB_PASSWORD=$(openssl rand -hex 16)"      >> $GITHUB_ENV
          echo "APP_DB_PASSWORD=$(openssl rand -hex 16)"  >> $GITHUB_ENV
          echo "JWT_SECRET=$(openssl rand -hex 32)"       >> $GITHUB_ENV

      # Yerel makinedeki ile AYNI yol: docker compose "tam" profili.
      # Yalniz db ve api servisleri; arayuz (web) testler icin gereksiz.
      - name: Veritabani ve kurulum
        working-directory: 04-kod
        run: docker compose --profile tam up -d --build db api

      # Kurulum (migration + RLS + ornek veri) API acilmadan ONCE kosar.
      # Yani API porta cevap veriyorsa kurulum bitmis demektir.
      - name: Kurulumun bitmesini bekle
        working-directory: 04-kod
        run: |
          for i in $(seq 1 80); do
            if curl -s -o /dev/null http://localhost:5146/; then
              echo "API ayakta - kurulum tamamlandi."
              exit 0
            fi
            sleep 3
          done
          echo "::error::API 4 dakikada ayaga kalkmadi. Kurulum kaydi asagida."
          docker compose --profile tam logs api
          exit 1

      # API'yi durduruyoruz: testler kendi uygulamalarini bellek icinde ayaga
      # kaldiriyor, ayrica acik kalan baglantilar test temizligini zorlastirir.
      - name: API'yi durdur
        working-directory: 04-kod
        run: docker compose --profile tam stop api

      - name: Testler
        working-directory: 04-kod/backend
        run: dotnet test --logger "console;verbosity=normal"

      # Kirmizi yandiginda sebebi gormek icin. Yalniz hata halinde calisir.
      - name: Hata halinde kayitlar
        if: failure()
        working-directory: 04-kod
        run: docker compose --profile tam logs

  # ===========================================================================
  # MOTOR - Python planlama motoru
  #
  # 16 Eylul'e kadar bu paket CI'da KOSMUYORDU ve gerekcesi yaziliydi: motor
  # yokken testler bilerek kirmiziydi, kirmizi bir paketi kapiya baglamak
  # "main her zaman yesil" kuralini bozardi. Motor bitti, kirmizi kalmadi,
  # gerekce de ortadan kalkti.
  #
  # KAPI NEYI KORUYOR
  #   * 17 kural govdesi   -- sessizce yanlis yorumlanamaz
  #   * 12 altin senaryo   -- Mustafa'nin onayladigi cumleler
  #   * #7.6 bagimsizligi  -- cozucu ile dogrulayici birbirini import edemez
  #   * fikstur tutarliligi -- capalar ve referanslar
  # ===========================================================================
  motor:
    name: Motor (dogrulayici + cozucu)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Depoyu al
        uses: actions/checkout@v7

      # Mustafa'nin makinesindeki surumun AYNISI. Ayni gerekce yukarida
      # docker icin de yazili: CI ile yerel arasinda fark olmasin.
      - name: Python kur
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: 09-motor/requirements.txt

      - name: Bagimliliklar
        run: python -m pip install -r 09-motor/requirements.txt

      # Birim testleri servis GEREKTIRMEZ. Once onlar kossun: bir kural
      # govdesi bozulduysa servis hic ayaga kalkmadan gorulsun.
      - name: Birim testleri
        working-directory: 09-motor
        run: python -m pytest testler -q

      # Altin senaryolar motoru HTTP uzerinden cagirir; servis ayakta olmali.
      - name: Motor servisini baslat
        working-directory: 09-motor
        run: |
          nohup python servis.py 8000 > /tmp/motor.log 2>&1 &
          for i in $(seq 1 20); do
            if curl -s -o /dev/null http://127.0.0.1:8000/health; then
              echo "Motor ayakta."
              exit 0
            fi
            sleep 1
          done
          echo "::error::Motor 20 saniyede ayaga kalkmadi. Kayit asagida."
          cat /tmp/motor.log
          exit 1

      # TSHIFT_MOTOR_URL verilmezse istemci "MOTOR ADRESI TANIMLI DEGIL" diye
      # patlar -- yani adres unutulursa kapi yesil yanmaz, kirmizi yanar.
      - name: Altin senaryolar
        working-directory: 08-motor-testleri/v5
        env:
          TSHIFT_MOTOR_URL: http://127.0.0.1:8000
        run: python -m pytest -q

      # Fikstur denetleyicisi: capalar, referanslar, turetilmis degerler.
      # Tutarsizlikta 1 doner, yani bu adim gercekten bir kapidir.
      - name: Fikstur tutarliligi
        working-directory: 08-motor-testleri/v5
        run: python fikstur-denetleyici.py

      # ZOR VERI SETI -- 500 KISI, IKI DOLULUK (%85 ve %95)
      #
      # NEDEN KAPIDA
      # 28 Eylul'de kurulan 350 kisilik set bir saat icinde alti hata buldu,
      # ama ELLE calistiriliyordu -- elle calistirilan bir set, unutuldugu
      # gun yok hukmundedir.
      #
      # 29 Eylul'de set YENIDEN kuruldu, cunku eskisi bizi KIRAMIYORDU:
      # 39 kuraldan 15'inin govdesi yoktu, kadro talebin iki katiydi ve 45
      # saatlik sozlesme sablonlarla tutturulamiyordu. Yenisi daha kapiya
      # baglanmadan UC hata buldu (T-57, T-58 ve K-38'in dogrulayiciya
      # uygulanmamis olmasi).
      #
      # TAM OLCEKLI COZUM BURADA KOSMAZ
      # 500 kiside model kurma tek basina ~65 saniye, cozum dakikalar.
      #   cozmeden olculenler -> TAM olcekte (model buyuklugu, 40 kuralin
      #                          tamami, 45 saati tutturan sablonlar,
      #                          ulasilamayan hucre, her kural kirmizi
      #                          yanabiliyor mu)
      #   cozum gerektirenler -> 0.1 olcekte, yalniz %95 seti (zor olani)
      # Tam olcekli cozum elle: `py coz-olc.py --saniye 900`
      #
      # Olculen kosu suresi: 12 test, ~4 dk 47 sn. Motor isinin sure siniri
      # bu yuzden 20 dakika: butce asimindan gelen kirmizi, gercek hatadan
      # gelen kirmiziya benziyor ve insani yanlis yere bakmaya gonderiyor.
      - name: Zor veri seti (500 kisi, %85 ve %95)
        working-directory: 08-motor-testleri/gercekci-veri-seti
        run: python -m pytest testler -q

      - name: Hata halinde motor kaydi
        if: failure()
        run: cat /tmp/motor.log || true
