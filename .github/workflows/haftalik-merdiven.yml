# =============================================================================
# TShift - HAFTALIK MERDIVEN BEKCISI (500 kisi, seviye 1)
#
# NE ISE YARAR
# Motor, 500 kisilik seviye 1 setini (K-62; talep referans plandan turer,
# HEDEF_ASIMI SERT -- K-67) SIFIRDAN cozebiliyor mu: plan cikar, asim 0,
# sert ihlal 0. Fazla mesai ve referans puanla kiyas loga YAZILIR, zorlanmaz:
# 2 cekirdekte fazla mesaisiz ilk arama 500 kiside bulunamiyor (12 Ekim,
# bulutta olculdu; eski S30'da da) -- burada zorlansa yanlis kirmizi olurdu.
#
# NEDEN AYRI VE HAFTALIK (Mustafa, 12 Ekim 22:11 -- "onerine katiliyorum")
# Her push'ta kossa test suresine 15-20 dk eklerdi (2 cekirdek: model kurma
# ~75 sn + 900 sn arama) ve sure sinirli arama yavas makinede yanlis kirmizi
# verebilirdi. Her push'taki kapi kucuk kopyadir (testler/test_merdiven.py,
# olcek 0.1); 500 kisilik referans bekcisi (cozucusuz) da her push'ta kosar.
# Bu is haftada bir ve istenince elle (Actions > Haftalik merdiven > Run).
# =============================================================================

name: Haftalik merdiven

on:
  schedule:
    - cron: '17 1 * * 1'        # pazartesi 01:17 UTC (04:17 TR)
  workflow_dispatch:

jobs:
  merdiven500:
    name: Seviye 1 - 500 kisi cozum bekcisi
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Depoyu al
        uses: actions/checkout@v7
      - name: Python kur
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: 09-motor/requirements.txt
      - name: Bagimliliklar
        run: python -m pip install -r 09-motor/requirements.txt
      - name: 500 kisilik seviye 1 cozum bekcisi
        working-directory: 08-motor-testleri/gercekci-veri-seti
        env:
          TSHIFT_MERDIVEN_500: "1"
          TSHIFT_MERDIVEN_SANIYE: "900"
        run: python -m pytest testler/test_merdiven.py -k HAFTALIK -s -q
