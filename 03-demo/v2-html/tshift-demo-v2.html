<!doctype html>
<html lang="tr"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TShift Demo v2</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* ============ tokens ============ */
:root{
  --ground:#EEF2F1; --surface:#FFFFFF; --surface-2:#E6EDEB; --surface-3:#F6F9F8; --surface-4:#DCE6E4;
  --ink:#101A19; --ink-2:#3C4F4C; --muted:#6C817D; --muted-2:#8A9C99;
  --line:#D5E0DD; --line-2:#B9C9C5;
  --brand:#17605B; --brand-2:#1F8C84; --brand-ink:#0E4340; --brand-soft:#DCECEA;
  --ok:#2E7D52; --ok-soft:#DEEFE4; --warn:#9C6510; --warn-soft:#F7EBD5; --crit:#A93A25; --crit-soft:#F7E1DC;
  --sh-1:0 1px 2px rgba(16,26,25,.06);
  --sh-2:0 2px 4px rgba(16,26,25,.05), 0 12px 28px -18px rgba(16,26,25,.5);
  --sh-3:0 8px 24px -8px rgba(16,26,25,.22), 0 30px 60px -30px rgba(16,26,25,.5);
  --r:8px; --r-sm:5px; --r-lg:12px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --ground:#0D1413; --surface:#141D1C; --surface-2:#1C2827; --surface-3:#111A19; --surface-4:#243230;
  --ink:#E3EBE9; --ink-2:#AEC0BC; --muted:#7E918D; --muted-2:#647873;
  --line:#243230; --line-2:#33453F;
  --brand:#4FBDB2; --brand-2:#6ED0C5; --brand-ink:#8EDDD4; --brand-soft:#10312E;
  --ok:#63C48D; --ok-soft:#112A1D; --warn:#D5A24E; --warn-soft:#2B2312; --crit:#E08A72; --crit-soft:#2E1712;
  --sh-1:0 1px 2px rgba(0,0,0,.4);
  --sh-2:0 2px 4px rgba(0,0,0,.4), 0 12px 28px -18px rgba(0,0,0,.9);
  --sh-3:0 8px 24px -8px rgba(0,0,0,.6), 0 30px 60px -30px rgba(0,0,0,1);
}}
:root[data-theme="dark"]{
  --ground:#0D1413; --surface:#141D1C; --surface-2:#1C2827; --surface-3:#111A19; --surface-4:#243230;
  --ink:#E3EBE9; --ink-2:#AEC0BC; --muted:#7E918D; --muted-2:#647873;
  --line:#243230; --line-2:#33453F;
  --brand:#4FBDB2; --brand-2:#6ED0C5; --brand-ink:#8EDDD4; --brand-soft:#10312E;
  --ok:#63C48D; --ok-soft:#112A1D; --warn:#D5A24E; --warn-soft:#2B2312; --crit:#E08A72; --crit-soft:#2E1712;
  --sh-1:0 1px 2px rgba(0,0,0,.4);
  --sh-2:0 2px 4px rgba(0,0,0,.4), 0 12px 28px -18px rgba(0,0,0,.9);
  --sh-3:0 8px 24px -8px rgba(0,0,0,.6), 0 30px 60px -30px rgba(0,0,0,1);
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; background:var(--ground); color:var(--ink);
  font-family:"Instrument Sans","Helvetica Neue",Arial,sans-serif;
  font-size:14px; line-height:1.5; -webkit-font-smoothing:antialiased;
}
.mono,code{font-family:"IBM Plex Mono",ui-monospace,monospace;font-variant-numeric:tabular-nums}
h1,h2,h3,h4{margin:0;letter-spacing:-.012em;font-weight:600}
h1{font-size:1.5rem;letter-spacing:-.02em}
h2{font-size:1.05rem}
h3{font-size:.94rem}
p{margin:0 0 10px}
a{color:var(--brand);text-decoration:none}
:focus-visible{outline:2px solid var(--brand-2);outline-offset:2px;border-radius:3px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ============ shell ============ */
.app{display:grid;grid-template-columns:236px 1fr;height:100vh;overflow:hidden}
.side{background:var(--surface-3);border-right:1px solid var(--line);display:flex;flex-direction:column;overflow:hidden}
.logo{padding:16px 18px 12px;display:flex;align-items:center;gap:9px;border-bottom:1px solid var(--line)}
.logo .m{width:26px;height:26px;border-radius:6px;background:var(--brand);display:grid;place-items:center;flex:none}
.logo .m span{color:#fff;font-weight:700;font-size:.8rem;letter-spacing:-.03em}
:root[data-theme="dark"] .logo .m span,:root:not([data-theme="light"]) .logo .m span{color:#08201E}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]) .logo .m span{color:#fff}}
.logo .t{font-weight:700;font-size:.98rem;letter-spacing:-.02em}
.logo .t small{display:block;font-weight:500;font-size:.62rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.nav{flex:1;overflow-y:auto;padding:10px 10px 24px}
.nav .grp{font-size:.62rem;font-weight:600;letter-spacing:.13em;text-transform:uppercase;color:var(--muted-2);padding:14px 8px 5px}
.nav a{display:flex;align-items:center;gap:9px;padding:7px 9px;border-radius:var(--r-sm);color:var(--ink-2);font-size:.86rem;font-weight:500;cursor:pointer}
.nav a:hover{background:var(--surface-2);color:var(--ink)}
.nav a.on{background:var(--brand-soft);color:var(--brand-ink);font-weight:600}
.nav a .ic{width:15px;text-align:center;flex:none;opacity:.8;font-size:.9em}
.nav a .cnt{margin-left:auto;font-family:"IBM Plex Mono",monospace;font-size:.68rem;background:var(--surface-4);color:var(--muted);padding:1px 5px;border-radius:9px}
.nav a.on .cnt{background:var(--brand);color:#fff}
.whoami{border-top:1px solid var(--line);padding:10px 12px;display:flex;align-items:center;gap:9px}
.av{width:28px;height:28px;border-radius:50%;background:var(--surface-4);display:grid;place-items:center;font-size:.72rem;font-weight:600;color:var(--ink-2);flex:none}
.whoami .n{font-size:.8rem;font-weight:600;line-height:1.2}
.whoami .r{font-size:.68rem;color:var(--muted)}

.main{display:flex;flex-direction:column;overflow:hidden}
.top{height:52px;border-bottom:1px solid var(--line);background:var(--surface);display:flex;align-items:center;gap:12px;padding:0 20px;flex:none}
.crumb{font-size:.78rem;color:var(--muted)}
.top h1{font-size:1.02rem;font-weight:600}
.top .sp{flex:1}
.view{flex:1;overflow-y:auto;padding:22px 24px 80px}
.view.flush{padding:0}
.wrap{max-width:1180px}

/* ============ atoms ============ */
.btn{font:inherit;font-size:.83rem;font-weight:600;padding:7px 13px;border-radius:var(--r-sm);border:1px solid var(--line-2);
  background:var(--surface);color:var(--ink-2);cursor:pointer;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{border-color:var(--brand);color:var(--brand-ink)}
.btn.p{background:var(--brand);border-color:var(--brand);color:#fff}
:root[data-theme="dark"] .btn.p,:root:not([data-theme="light"]) .btn.p{color:#08201E}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]) .btn.p{color:#fff}}
.btn.p:hover{background:var(--brand-2);border-color:var(--brand-2)}
.btn.sm{font-size:.76rem;padding:4px 9px}
.btn.gh{border-color:transparent;background:transparent}
.btn.gh:hover{background:var(--surface-2)}
.btn:disabled{opacity:.45;cursor:default}
.btn.dg{color:var(--crit);border-color:var(--line-2)}
.btn.dg:hover{border-color:var(--crit);color:var(--crit)}

.tag{display:inline-flex;align-items:center;gap:4px;font-family:"IBM Plex Mono",monospace;font-size:.66rem;font-weight:600;
  padding:2px 6px;border-radius:3px;background:var(--surface-4);color:var(--ink-2);white-space:nowrap}
.tag.ok{background:var(--ok-soft);color:var(--ok)}
.tag.warn{background:var(--warn-soft);color:var(--warn)}
.tag.crit{background:var(--crit-soft);color:var(--crit)}
.tag.brand{background:var(--brand-soft);color:var(--brand-ink)}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh-1)}
.card .hd{padding:13px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
.card .hd h3{flex:1}
.card .bd{padding:16px}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(175px,1fr))}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}

.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:13px 15px}
.stat .k{font-size:.7rem;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);display:flex;align-items:center;gap:4px}
.stat .v{font-family:"IBM Plex Mono",monospace;font-size:1.5rem;font-weight:600;letter-spacing:-.02em;margin-top:3px;line-height:1.1}
.stat .s{font-size:.74rem;color:var(--muted);margin-top:2px}
.stat.ok .v{color:var(--ok)} .stat.warn .v{color:var(--warn)} .stat.crit .v{color:var(--crit)}

input[type=text],input[type=number],input[type=date],input[type=time],input[type=email],select,textarea{
  font:inherit;font-size:.85rem;width:100%;padding:7px 10px;border-radius:var(--r-sm);
  border:1px solid var(--line-2);background:var(--surface);color:var(--ink)}
textarea{min-height:70px;resize:vertical}
label.f{display:block;margin-bottom:11px}
label.f .lb{display:block;font-size:.74rem;font-weight:600;color:var(--muted);margin-bottom:4px}
label.f .hint{font-size:.72rem;color:var(--muted-2);margin-top:3px}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}

.tbl-w{overflow:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table.t{border-collapse:collapse;width:100%;font-size:.83rem}
table.t th{position:sticky;top:0;z-index:1;background:var(--surface-3);text-align:left;padding:9px 12px;
  font-size:.68rem;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);
  border-bottom:1px solid var(--line-2);white-space:nowrap}
table.t td{padding:8px 12px;border-bottom:1px solid var(--line);color:var(--ink-2);vertical-align:middle}
table.t tr:last-child td{border-bottom:none}
table.t tbody tr:hover td{background:var(--surface-3)}
table.t td.n{font-family:"IBM Plex Mono",monospace;text-align:right}
table.t td.s{color:var(--ink);font-weight:500}
table.t tr.clk{cursor:pointer}

.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:16px;overflow-x:auto}
.tabs button{font:inherit;font-size:.84rem;font-weight:600;padding:8px 13px;border:none;background:none;
  color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap}
.tabs button:hover{color:var(--ink)}
.tabs button.on{color:var(--brand-ink);border-bottom-color:var(--brand)}

.seg{display:inline-flex;border:1px solid var(--line-2);border-radius:var(--r-sm);overflow:hidden;background:var(--surface)}
.seg button{font:inherit;font-size:.78rem;font-weight:600;padding:5px 11px;border:none;background:none;color:var(--muted);cursor:pointer}
.seg button+button{border-left:1px solid var(--line-2)}
.seg button.on{background:var(--brand-soft);color:var(--brand-ink)}

.empty{text-align:center;padding:46px 20px;color:var(--muted)}
.empty .big{font-size:1.6rem;margin-bottom:8px;opacity:.4}

/* metric tooltip */
.q{display:inline-grid;place-items:center;width:13px;height:13px;border-radius:50%;border:1px solid var(--line-2);
  font-size:.58rem;font-weight:700;color:var(--muted);cursor:help;flex:none;position:relative;font-family:"Instrument Sans",sans-serif}
.q:hover{border-color:var(--brand);color:var(--brand)}
.tip{position:fixed;z-index:400;max-width:290px;background:var(--surface);border:1px solid var(--line-2);
  border-radius:var(--r);box-shadow:var(--sh-3);padding:11px 13px;font-size:.79rem;line-height:1.45;color:var(--ink-2);pointer-events:none}
.tip .tt{font-weight:700;color:var(--ink);font-size:.82rem;margin-bottom:3px}
.tip .ty{font-style:italic;color:var(--brand-ink);margin:5px 0}
.tip .tx{font-size:.74rem;color:var(--muted);margin-top:5px;border-top:1px solid var(--line);padding-top:5px}

/* modal */
.scrim{position:fixed;inset:0;background:rgba(16,26,25,.45);z-index:300;display:grid;place-items:center;padding:24px}
.modal{background:var(--surface);border-radius:var(--r-lg);box-shadow:var(--sh-3);width:100%;max-width:560px;
  max-height:88vh;display:flex;flex-direction:column;overflow:hidden}
.modal.wide{max-width:860px} .modal.xwide{max-width:1080px}
.modal .mh{padding:16px 20px;border-bottom:1px solid var(--line);display:flex;align-items:flex-start;gap:12px}
.modal .mh h2{flex:1}
.modal .mh .sub{font-size:.79rem;color:var(--muted);margin-top:2px;font-weight:400}
.modal .mb{padding:18px 20px;overflow-y:auto;flex:1}
.modal .mf{padding:13px 20px;border-top:1px solid var(--line);display:flex;gap:9px;justify-content:flex-end;background:var(--surface-3)}
.x{font:inherit;border:none;background:none;font-size:1.15rem;color:var(--muted);cursor:pointer;line-height:1;padding:2px 5px;border-radius:4px}
.x:hover{background:var(--surface-2);color:var(--ink)}

/* toast */
.toasts{position:fixed;right:18px;bottom:18px;z-index:500;display:flex;flex-direction:column;gap:8px;align-items:flex-end}
.toast{background:var(--surface);border:1px solid var(--line-2);border-left:3px solid var(--ok);border-radius:var(--r);
  box-shadow:var(--sh-3);padding:11px 14px;display:flex;align-items:center;gap:12px;font-size:.84rem;max-width:400px}
.toast.warn{border-left-color:var(--warn)}
.toast .msg{flex:1;color:var(--ink-2)}

.note{border-left:3px solid var(--brand);background:var(--surface-3);padding:11px 14px;border-radius:0 var(--r) var(--r) 0;
  font-size:.83rem;color:var(--ink-2);margin:12px 0}
.note.warn{border-left-color:var(--warn);background:var(--warn-soft)}
.note.crit{border-left-color:var(--crit);background:var(--crit-soft)}
.note b{color:var(--ink)}

.demo-bar{background:var(--warn-soft);color:var(--warn);font-size:.75rem;font-weight:600;padding:5px 20px;
  border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px;flex:none}

@media (max-width:900px){
  .app{grid-template-columns:1fr}
  .side{position:fixed;inset:0 auto 0 0;width:236px;z-index:200;transform:translateX(-100%);transition:transform .2s;box-shadow:var(--sh-3)}
  .side.open{transform:none}
  .burger{display:inline-flex!important}
}
.burger{display:none}
</style></head>
<body>
<div id="root"></div>
<div class="toasts" id="toasts"></div>
<div id="modal-host"></div>
<script>
/* ==========================================================================
   TShift Demo v2 — tıklanabilir prototip
   Gerçek veri yok; çağrı merkezi operasyonu benzetimi.
   Spec: 02-spec/v1.1-master-spec.md
   ========================================================================== */

/* ---------- yardımcılar ---------- */
const $ = (s,r=document)=>r.querySelector(s);
const $$ = (s,r=document)=>[...r.querySelectorAll(s)];
const el = (t,c,x)=>{const n=document.createElement(t); if(c)n.className=c; if(x!=null)n.textContent=x; return n;};
const esc = s => String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const h = (str,...v) => str.reduce((a,s,i)=>a+s+(v[i]==null?'':v[i]),'');
const pad = n => String(n).padStart(2,'0');
const saat = v => pad(Math.floor(v)%24)+':'+pad(Math.round((v%1)*60));
const saatUzun = v => pad(Math.floor(v))+':'+pad(Math.round((v%1)*60));
const GUNLER = ['Pazartesi','Salı','Çarşamba','Perşembe','Cuma','Cumartesi','Pazar'];
const GUNK = ['Pzt','Sal','Çar','Per','Cum','Cmt','Paz'];
const AYLAR = ['Ocak','Şubat','Mart','Nisan','Mayıs','Haziran','Temmuz','Ağustos','Eylül','Ekim','Kasım','Aralık'];

function rng(seed){ let s=seed>>>0; return ()=> (s=(s*1664525+1013904223)>>>0)/4294967296; }
const R = rng(20260909);
const pick = a => a[Math.floor(R()*a.length)];
const pickN = (a,n)=>{const c=[...a],o=[];while(o.length<n&&c.length)o.push(c.splice(Math.floor(R()*c.length),1)[0]);return o;};
const num = n => n.toLocaleString('tr-TR');
const dec = (n,d=1) => n.toLocaleString('tr-TR',{minimumFractionDigits:d,maximumFractionDigits:d});

function tarihStr(d){ return `${d.getDate()} ${AYLAR[d.getMonth()]} ${d.getFullYear()}`; }
function tarihKisa(d){ return `${pad(d.getDate())}.${pad(d.getMonth()+1)}`; }
function gunEkle(d,n){ const x=new Date(d); x.setDate(x.getDate()+n); return x; }
</script>
<script>
/* ==========================================================================
   VERİ KATMANI — Anadolu Çağrı Merkezi (kurgu operasyon)
   ========================================================================== */
const AD_E=['Mert','Burak','Emre','Kaan','Onur','Serkan','Deniz','Barış','Cem','Tolga','Uğur','Efe','Arda','Berk','Volkan','Sinan','Hakan','Murat','Eren','Yiğit','Ozan','Doruk','Kerem','Alp','Tarık'];
const AD_K=['Selin','Ayşe','Zeynep','Elif','Merve','Ceren','Buse','Gizem','Ece','Pınar','Damla','Sıla','İrem','Aslı','Duygu','Melis','Esra','Tuğçe','Beren','Nihan','Yağmur','Sude','Defne','Nur','Bilge'];
const SOYAD=['Kaya','Arslan','Demir','Yılmaz','Çelik','Şahin','Yıldız','Aydın','Öztürk','Doğan','Kurt','Koç','Aksoy','Polat','Erdoğan','Tekin','Güneş','Bulut','Ateş','Korkmaz','Şen','Ünal','Turan','Avcı','Kılıç','Sarı','Duman','Taş','Aslan','Çakır'];

const EKIPLER=[
  {id:'t1',ad:'Müşteri Hizmetleri',kod:'MH',renk:'#17605B'},
  {id:'t2',ad:'Teknik Destek',kod:'TD',renk:'#8A5A1E'},
  {id:'t3',ad:'Satış & Kurtarma',kod:'SK',renk:'#4A4488'},
];
const DEPARTMAN={id:'d1',ad:'Çağrı Merkezi Operasyon',calisma:'saatli',acilis:8,kapanis:24};

const SABLONLAR=[
  {id:'s1',ad:'Sabah',kod:'SAB',bas:8,bit:16,mola:60,renk:'#2E7D52'},
  {id:'s2',ad:'Ara',kod:'ARA',bas:10,bit:18,mola:60,renk:'#17605B'},
  {id:'s3',ad:'Akşam',kod:'AKS',bas:16,bit:24,mola:60,renk:'#8A5A1E'},
  {id:'s4',ad:'Yarım gün sabah',kod:'YS',bas:9,bit:13,mola:15,renk:'#4A4488'},
  {id:'s5',ad:'Yarım gün akşam',kod:'YA',bas:18,bit:22,mola:15,renk:'#7A3A63'},
];

const YETKINLIKLER=[
  {id:'y1',ad:'İngilizce',kod:'ING'},
  {id:'y2',ad:'Kurumsal müşteri',kod:'KUR'},
  {id:'y3',ad:'Fatura & tahsilat',kod:'FAT'},
  {id:'y4',ad:'Teknik seviye-2',kod:'TS2'},
];

/* --- çalışanlar --- */
const CALISANLAR=[];
(function(){
  const N=214;
  for(let i=0;i<N;i++){
    const k = R()<0.58;
    const ad = k?pick(AD_K):pick(AD_E);
    const soyad = pick(SOYAD);
    const ekip = R()<0.52?'t1':(R()<0.62?'t2':'t3');
    const yariZamanli = R()<0.22;
    const lider = i%18===3;
    const durum = R()<0.04?'pasif':'aktif';
    const yetk=[];
    if(R()<0.28) yetk.push('y1');
    if(R()<0.22) yetk.push('y2');
    if(R()<0.35) yetk.push('y3');
    if(ekip==='t2'&&R()<0.4) yetk.push('y4');
    CALISANLAR.push({
      id:'e'+(i+1), sicil:'A'+(4100+i*3+Math.floor(R()*3)),
      ad, soyad, tam:ad+' '+soyad,
      ekip, lider,
      sozlesme: yariZamanli?'yari_zamanli':'tam_zamanli',
      haftalik: yariZamanli?(R()<0.5?20:24):45,
      gunlukAzami: yariZamanli?5:9,
      yetkinlikler:yetk,
      giris:new Date(2019+Math.floor(R()*7),Math.floor(R()*12),1+Math.floor(R()*28)),
      durum,
      eposta:(ad+'.'+soyad).toLocaleLowerCase('tr').replace(/[şğüöçı]/g,c=>({'ş':'s','ğ':'g','ü':'u','ö':'o','ç':'c','ı':'i'}[c]))+'@anadolucm.com',
      telefon:'0'+(530+Math.floor(R()*40))+' '+(100+Math.floor(R()*900))+' '+(10+Math.floor(R()*90))+' '+(10+Math.floor(R()*90)),
    });
  }
})();
const AKTIF = CALISANLAR.filter(c=>c.durum==='aktif');
const byId = Object.fromEntries(CALISANLAR.map(c=>[c.id,c]));
const ekipAd = id => (EKIPLER.find(e=>e.id===id)||{}).ad||'—';
const ekipObj = id => EKIPLER.find(e=>e.id===id)||EKIPLER[0];
const sablonObj = id => SABLONLAR.find(s=>s.id===id)||SABLONLAR[0];

/* --- izinler --- */
const HAFTA_BAS = new Date(2026,9,12); // 12 Ekim 2026 Pazartesi
const IZINLER=[];
(function(){
  const tipler=['yillik','mazeret','rapor','ucretsiz'];
  for(let i=0;i<26;i++){
    const c = pick(AKTIF);
    const off = Math.floor(R()*26)-8;
    const uzun = R()<0.3?2+Math.floor(R()*3):1;
    IZINLER.push({
      id:'i'+(i+1), calisan:c.id, tip:pick(tipler),
      bas:gunEkle(HAFTA_BAS,off), bit:gunEkle(HAFTA_BAS,off+uzun-1),
      gun:uzun, tumGun:true,
      durum: off<0?'onayli':(R()<0.45?'talep':'onayli'),
      aciklama: R()<0.3?pick(['Aile ziyareti','Sağlık kontrolü','Taşınma','Düğün','Kişisel']):''
    });
  }
})();

/* --- talep (ekip × gün × saat) --- */
const TALEP={};
(function(){
  const gunKat=[1,1,1.02,1.05,1.12,.82,.6];
  const saatEgri={8:.35,9:.62,10:.86,11:.95,12:.78,13:.72,14:.9,15:1,16:.96,17:.88,18:.74,19:.62,20:.5,21:.4,22:.3,23:.22};
  EKIPLER.forEach(t=>{
    const taban = t.id==='t1'?11:(t.id==='t2'?6:4);
    for(let g=0;g<7;g++) for(let s=8;s<24;s++){
      const hedef = Math.max(1,Math.round(taban*gunKat[g]*(saatEgri[s]||.2)));
      TALEP[`${t.id}|${g}|${s}`]={hedef,asgari:Math.max(1,Math.round(hedef*0.78))};
    }
  });
})();
const talepAl=(t,g,s)=>TALEP[`${t}|${g}|${s}`]||{hedef:0,asgari:0};

<script>
/* ==========================================================================
   PLAN ÜRETİCİ (demo benzetimi — gerçek motor CP-SAT'tir, spec §11)
   ========================================================================== */
function izinliMi(cid,gunIx){
  const d=gunEkle(HAFTA_BAS,gunIx);
  return IZINLER.some(i=>i.calisan===cid&&i.durum==='onayli'&&d>=i.bas&&d<=i.bit);
}
function uretPlan(profil){
  const agir={DENGELI:{fm:0.35,hedef:.9},KAPSAMA:{fm:1,hedef:1},CALISAN:{fm:0,hedef:.78}}[profil];
  const atamalar=[]; const saatler={}; const gunler={}; const geceSay={};
  AKTIF.forEach(c=>{saatler[c.id]=0;gunler[c.id]=new Set();geceSay[c.id]=0;});
  const rr=rng(profil==='DENGELI'?7:(profil==='KAPSAMA'?11:23));

  for(let g=0;g<7;g++){
    EKIPLER.forEach(t=>{
      const havuz=AKTIF.filter(c=>c.ekip===t.id&&!izinliMi(c.id,g)&&!gunler[c.id].has(g));
      // saat başına ihtiyaç
      const ihtiyac={}; for(let s=8;s<24;s++){const q=talepAl(t.id,g,s); ihtiyac[s]=Math.round(q.asgari+(q.hedef-q.asgari)*agir.hedef);}
      const doluluk={}; for(let s=8;s<24;s++) doluluk[s]=0;
      let guard=0;
      while(guard++<400){
        let acikS=-1,acikMik=0;
        for(let s=8;s<24;s++){const d=ihtiyac[s]-doluluk[s]; if(d>acikMik){acikMik=d;acikS=s;}}
        if(acikS<0) break;
        const uygunSab=SABLONLAR.filter(sb=>sb.bas<=acikS&&sb.bit>acikS);
        if(!uygunSab.length) break;
        const sb=uygunSab[Math.floor(rr()*uygunSab.length)];
        const sure=sb.bit-sb.bas-sb.mola/60;
        const aday=havuz.filter(c=>{
          if(gunler[c.id].has(g)) return false;
          if(sure>c.gunlukAzami) return false;
          const yeni=saatler[c.id]+sure;
          const tavan=c.sozlesme==='yari_zamanli'?c.haftalik:(c.haftalik+(profil==='KAPSAMA'?15:(profil==='DENGELI'?10:0)));
          if(yeni>tavan) return false;
          if(gunler[c.id].size>=(c.sozlesme==='yari_zamanli'?4:6)) return false;
          return true;
        });
        if(!aday.length){ ihtiyac[acikS]=doluluk[acikS]; continue; }
        aday.sort((a,b)=>(saatler[a.id]/a.haftalik)-(saatler[b.id]/b.haftalik));
        const c=aday[Math.floor(rr()*Math.min(6,aday.length))];
        atamalar.push({id:'a'+atamalar.length, calisan:c.id, ekip:t.id, sablon:sb.id, gun:g,
          bas:sb.bas, bit:sb.bit, mola:sb.mola, kilit:false, kaynak:'motor'});
        gunler[c.id].add(g); saatler[c.id]+=sure;
        if(sb.bit>=22) geceSay[c.id]=(geceSay[c.id]||0)+1;
        for(let s=sb.bas;s<sb.bit;s++) doluluk[s]++;
      }
    });
  }
  return {profil, atamalar, saatler, geceSay};
}
function kapsamaHesap(atamalar){
  const d={};
  atamalar.forEach(a=>{ for(let s=a.bas;s<a.bit;s++){const k=`${a.ekip}|${a.gun}|${s}`; d[k]=(d[k]||0)+1;} });
  return d;
}
function metrikHesap(p){
  const d=kapsamaHesap(p.atamalar);
  let hedefT=0,hedefO=0,asgT=0,asgO=0,acikSaat=0;
  EKIPLER.forEach(t=>{for(let g=0;g<7;g++)for(let s=8;s<24;s++){
    const q=talepAl(t.id,g,s), v=d[`${t.id}|${g}|${s}`]||0;
    hedefT+=q.hedef; hedefO+=Math.min(v,q.hedef);
    asgT+=q.asgari; asgO+=Math.min(v,q.asgari);
    if(v<q.asgari) acikSaat++;
  }});
  let fm=0,sapmaTop=0,n=0;
  AKTIF.forEach(c=>{const s=p.saatler[c.id]||0; if(s>c.haftalik) fm+=s-c.haftalik; sapmaTop+=Math.abs(s-c.haftalik); n++;});
  const geceler=AKTIF.map(c=>p.geceSay[c.id]||0);
  const ort=geceler.reduce((a,b)=>a+b,0)/geceler.length;
  const std=Math.sqrt(geceler.reduce((a,b)=>a+(b-ort)**2,0)/geceler.length);
  const toplamSaat=Object.values(p.saatler).reduce((a,b)=>a+b,0);
  return {
    hedef:hedefO/hedefT*100, asgari:asgO/asgT*100, acikSaat,
    toplamSaat:Math.round(toplamSaat), fm:Math.round(fm),
    adalet:std, saatDenge:sapmaTop/n,
    tercih: p.profil==='CALISAN'?3:(p.profil==='DENGELI'?12:31),
    gap: p.profil==='DENGELI'?0.01:(p.profil==='KAPSAMA'?0.04:0.02),
    sure: p.profil==='DENGELI'?47:(p.profil==='KAPSAMA'?63:38),
    sertIhlal:0, kisi:new Set(p.atamalar.map(a=>a.calisan)).size
  };
}
const PLANLAR={};
['DENGELI','KAPSAMA','CALISAN'].forEach(pr=>{const p=uretPlan(pr); p.metrik=metrikHesap(p); PLANLAR[pr]=p;});

/* --- hafta ortası olay + plana değen izin talepleri (etki analizi için) --- */
const OLAY_RAPOR=[];
const IZIN_TALEP=[];
(function(){
  const p=PLANLAR.DENGELI;
  // en dar kapsamalı hücrelerden birkaç kişiyi çıkar
  const aday=p.atamalar.filter(a=>a.gun>=4&&a.bit>=20);
  const secilen=[];
  for(let i=0;i<aday.length&&secilen.length<4;i+=Math.max(1,Math.floor(aday.length/9))){
    const a=aday[i];
    if(secilen.some(x=>x.calisan===a.calisan)) continue;
    secilen.push({calisan:a.calisan,gun:a.gun,ekip:a.ekip});
  }
  OLAY_RAPOR.push(...secilen);

  // plan haftasında vardiyası olan kişiler için izin talebi üret
  const kullanildi=new Set(secilen.map(s=>s.calisan));
  const havuz=[];
  p.atamalar.forEach(a=>{ if(a.gun>=1&&a.gun<=5&&!kullanildi.has(a.calisan)&&!havuz.some(x=>x.calisan===a.calisan)) havuz.push(a); });
  const tipler=['yillik','mazeret','yillik','ucretsiz','mazeret','yillik'];
  for(let i=0;i<6;i++){
    const a=havuz[Math.floor(i*havuz.length/7)];
    if(!a) break;
    IZIN_TALEP.push({id:'it'+i, calisan:a.calisan, tip:tipler[i],
      bas:gunEkle(HAFTA_BAS,a.gun), bit:gunEkle(HAFTA_BAS,Math.min(6,a.gun+(i%2))),
      gun:1+(i%2), tumGun:true, durum:'talep',
      aciklama:['Aile ziyareti','Sağlık kontrolü','Taşınma','Düğün','Kişisel','Sınav'][i]});
  }
  IZINLER.push(...IZIN_TALEP);
})();

  DENGELI:{ad:'Dengeli',aciklama:'Kapsama ile çalışan memnuniyeti arasında denge kurar. Çoğu hafta için doğru seçim.'},
  KAPSAMA:{ad:'Kapsama odaklı',aciklama:'Hiçbir saat açık kalmasın; gerekirse fazla mesai yapılır. Yoğun dönemler için.'},
  CALISAN:{ad:'Çalışan odaklı',aciklama:'Tercihler ve adalet önce; kapsamadan bir miktar feragat eder.'},
};

const GERCEKLESEN=[];
(function(){
  const p=PLANLAR.DENGELI;

  });
})();

   ========================================================================== */
const S = {
  rota:'panel',
  rol:'mudur',                 // mudur | sef | calisan
  planDurum:'adaylar_hazir',   // taslak | adaylar_hazir | secildi | onayda | onayli | yayinda
  secili:null,                 // seçilen profil kodu
  editor:{atamalar:[],gecmis:[],gorunum:'hafta',gun:4,ustAcik:true,solAcik:true,sagAcik:true,sagSekme:'asistan',secim:null},
  benCalisan:'e7',
};

const MENU=[
  {grp:'Planlama',items:[
    {id:'panel',ad:'Kontrol merkezi',ic:'◧'},
    {id:'planlar',ad:'Planlar',ic:'▤'},
    {id:'karsilastir',ad:'Plan karşılaştırma',ic:'⊞',gizli:true},
    {id:'editor',ad:'Plan editörü',ic:'▦',gizli:true},
    {id:'gecmis',ad:'Geçmiş planlar',ic:'◷'},
  ]},
  {grp:'Kadro',items:[
    {id:'calisanlar',ad:'Çalışanlar',ic:'☰',cnt:()=>AKTIF.length},
    {id:'ekipler',ad:'Ekipler & şubeler',ic:'⌸'},
    {id:'yetkinlik',ad:'Yetkinlikler',ic:'✦'},
    {id:'izinler',ad:'İzinler',ic:'◔',cnt:()=>IZINLER.filter(i=>i.durum==='talep').length},
  ]},
  {grp:'Tanımlar',items:[
    {id:'sablonlar',ad:'Vardiya şablonları',ic:'▭'},
    {id:'kurallar',ad:'Kural yönetimi',ic:'⚖'},
    {id:'talep',ad:'Talep & kapasite',ic:'◈'},
  ]},
  {grp:'Veri & Rapor',items:[
    {id:'aktarma',ad:'Gerçekleşen veri',ic:'⇪'},
    {id:'realizasyon',ad:'Plan realizasyon',ic:'◑'},
    {id:'haftalik',ad:'Haftalık takip',ic:'▥'},
    {id:'analiz',ad:'Analizler',ic:'◭'},
  ]},
  {grp:'Yönetim',items:[
    {id:'kullanicilar',ad:'Kullanıcılar',ic:'☖'},
    {id:'bildirim',ad:'Bildirim ayarları',ic:'◇'},
    {id:'benim',ad:'Benim takvimim',ic:'◐'},
  ]},
];
const EKRAN_AD = id => { for(const g of MENU) for(const i of g.items) if(i.id===id) return i.ad; return ''; };

function git(rota,ops){ S.rota=rota; if(ops) Object.assign(S,ops); ciz(); $('.view')&&($('.view').scrollTop=0); }

/* --- tooltip --- */
let tipEl=null;
document.addEventListener('mouseover',e=>{
  const q=e.target.closest('.q'); if(!q) return;
  const m=METRIK[q.dataset.m]; if(!m) return;
  tipEl=el('div','tip');
  tipEl.innerHTML=`<div class="tt">${esc(m.ad)}</div><div>${esc(m.kisa)}</div>
    <div class="ty">${esc(m.yon)}</div><div>${esc(m.ornek)}</div>
    ${m.detay?`<div class="tx">ⓘ ${esc(m.detay)}</div>`:''}`;
  document.body.appendChild(tipEl);
  const r=q.getBoundingClientRect(), t=tipEl.getBoundingClientRect();
  let left=Math.min(r.left, innerWidth-t.width-12), top=r.bottom+7;
  if(top+t.height>innerHeight-8) top=r.top-t.height-7;
  tipEl.style.left=Math.max(8,left)+'px'; tipEl.style.top=Math.max(8,top)+'px';
});
document.addEventListener('mouseout',e=>{ if(e.target.closest('.q')&&tipEl){tipEl.remove();tipEl=null;} });
const Q = kod => `<span class="q" data-m="${kod}" tabindex="0" role="img" aria-label="açıklama">?</span>`;

/* --- toast --- */
function toast(msg,opt={}){
  const t=el('div','toast'+(opt.warn?' warn':''));
  t.innerHTML=`<span class="msg">${msg}</span>`;
  if(opt.geriAl){ const b=el('button','btn sm','Geri al'); b.onclick=()=>{t.remove();opt.geriAl();}; t.appendChild(b); }
  $('#toasts').appendChild(t);
  setTimeout(()=>t.remove(), opt.uzun?12000:6000);
}

/* --- modal --- */
function modal({baslik,alt,govde,aksiyon,genis}){
  kapatModal();
  const sc=el('div','scrim');
  sc.innerHTML=`<div class="modal ${genis||''}" role="dialog" aria-modal="true">
    <div class="mh"><div style="flex:1"><h2>${baslik}</h2>${alt?`<div class="sub">${alt}</div>`:''}</div>
      <button class="x" aria-label="Kapat">×</button></div>
    <div class="mb"></div><div class="mf"></div></div>`;
  const bd=$('.mb',sc);
  if(typeof govde==='string') bd.innerHTML=govde; else bd.appendChild(govde);
  const mf=$('.mf',sc);
  (aksiyon||[{ad:'Kapat'}]).forEach(a=>{
    const b=el('button','btn'+(a.tur==='p'?' p':'')+(a.tur==='dg'?' dg':''),a.ad);
    b.onclick=()=>{ if(!a.fn||a.fn(bd)!==false) kapatModal(); };
    mf.appendChild(b);
  });
  $('.x',sc).onclick=kapatModal;
  sc.onclick=e=>{ if(e.target===sc) kapatModal(); };
  $('#modal-host').appendChild(sc);
  const f=bd.querySelector('input,select,textarea'); f&&f.focus();
  return sc;
}
function kapatModal(){ $('#modal-host').innerHTML=''; }
document.addEventListener('keydown',e=>{ if(e.key==='Escape') kapatModal(); });

/* --- kabuk çizimi --- */
function ciz(){
  const root=$('#root');
  root.innerHTML=`<div class="app">
    <aside class="side" id="side">
      <div class="logo"><div class="m"><span>TS</span></div>
        <div class="t">TShift<small>Anadolu ÇM</small></div></div>
      <nav class="nav" id="nav"></nav>
      <div class="whoami">
        <div class="av">${S.rol==='calisan'?'SA':'MK'}</div>
        <div style="flex:1"><div class="n">${S.rol==='calisan'?'Selin Arslan':'Murat Kaya'}</div>
          <div class="r">${S.rol==='mudur'?'Departman müdürü':(S.rol==='sef'?'Takım lideri':'Çalışan')}</div></div>
        <button class="btn gh sm" id="rolBtn" title="Rol değiştir">⇄</button>
      </div>
    </aside>
    <main class="main">
      <div class="demo-bar">◆ DEMO — kurgu veriyle çalışan tıklanabilir prototip · Anadolu Çağrı Merkezi (214 çalışan, 3 ekip)</div>
      <header class="top">
        <button class="btn gh sm burger" id="burger">☰</button>
        <div><div class="crumb" id="crumb"></div><h1 id="baslik"></h1></div>
        <div class="sp"></div><div id="topAks" class="row"></div>
      </header>
      <div class="view" id="view"></div>
    </main></div>`;
  // menü
  const nav=$('#nav');
  MENU.forEach(g=>{
    const vis=g.items.filter(i=>!i.gizli||S.rota===i.id);
    if(!vis.length) return;
    nav.appendChild(el('div','grp',g.grp));
    vis.forEach(i=>{
      const a=el('a',S.rota===i.id?'on':'');
      a.innerHTML=`<span class="ic">${i.ic}</span><span>${i.ad}</span>${i.cnt?`<span class="cnt">${i.cnt()}</span>`:''}`;
      a.onclick=()=>git(i.id); a.tabIndex=0;
      a.onkeydown=e=>{if(e.key==='Enter')git(i.id);};
      nav.appendChild(a);
    });
  });
  $('#burger').onclick=()=>$('#side').classList.toggle('open');
  $('#rolBtn').onclick=rolDegistir;
  $('#baslik').textContent=EKRAN_AD(S.rota)||'—';
  $('#crumb').textContent='Anadolu Çağrı Merkezi · Operasyon';
  (EKRANLAR[S.rota]||EKRANLAR.panel)($('#view'),$('#topAks'));
}
function rolDegistir(){
  const s=['mudur','sef','calisan']; S.rol=s[(s.indexOf(S.rol)+1)%3];
  if(S.rol==='calisan') git('benim'); else git(S.rota==='benim'?'panel':S.rota);
  toast(`Rol değişti: <b>${S.rol==='mudur'?'Departman müdürü':(S.rol==='sef'?'Takım lideri':'Çalışan')}</b>`);
}
const EKRANLAR={};
</script>
<script>
/* ==========================================================================
   EKRAN — Kontrol merkezi
   ========================================================================== */
EKRANLAR.panel=(v,top)=>{
  const m=PLANLAR.DENGELI.metrik;
  const talepBek=IZINLER.filter(i=>i.durum==='talep').length;
  const durumRozet={taslak:['tag','taslak'],adaylar_hazir:['tag warn','3 aday hazır — seçim bekliyor'],
    secildi:['tag brand','seçildi — düzenlemede'],onayda:['tag warn','onay bekliyor'],
    onayli:['tag ok','onaylı'],yayinda:['tag ok','yayında']}[S.planDurum];
  top.innerHTML='';
  const b=el('button','btn p','+ Yeni plan'); b.onclick=planSihirbaz; top.appendChild(b);

  v.innerHTML=`<div class="wrap">
  <div class="grid g4" style="margin-bottom:18px">
    <div class="stat"><div class="k">Aktif çalışan</div><div class="v">${AKTIF.length}</div><div class="s">${CALISANLAR.length-AKTIF.length} pasif</div></div>
    <div class="stat ok"><div class="k">Hedef kapsama ${Q('HEDEF_KAPSAMA')}</div><div class="v">%${dec(m.hedef)}</div><div class="s">bu haftanın planı</div></div>
    <div class="stat"><div class="k">Planlanan saat</div><div class="v">${num(m.toplamSaat)}</div><div class="s">fazla mesai ${m.fm} sa</div></div>
    <div class="stat ${talepBek?'warn':''}"><div class="k">Bekleyen izin</div><div class="v">${talepBek}</div><div class="s">onay bekliyor</div></div>
  </div>

  <div class="grid g2">
    <div class="card"><div class="hd"><h3>Bu haftanın planı</h3><span class="${durumRozet[0]}">${durumRozet[1]}</span></div>
      <div class="bd">
        <div style="font-size:.82rem;color:var(--muted);margin-bottom:10px">
          ${tarihStr(HAFTA_BAS)} – ${tarihStr(gunEkle(HAFTA_BAS,6))} · Çağrı Merkezi Operasyon</div>
        <div class="row" style="gap:20px;margin-bottom:14px">
          <div><div style="font-size:.7rem;color:var(--muted)">Sert ihlal</div>
            <div class="mono" style="font-size:1.1rem;color:var(--ok);font-weight:600">0</div></div>
          <div><div style="font-size:.7rem;color:var(--muted)">Açık saat</div>
            <div class="mono" style="font-size:1.1rem;font-weight:600">${m.acikSaat}</div></div>
          <div><div style="font-size:.7rem;color:var(--muted)">Adalet ${Q('ADALET')}</div>
            <div class="mono" style="font-size:1.1rem;font-weight:600">${dec(m.adalet,2)}</div></div>
        </div>
        <div class="row">
          <button class="btn p" id="pl1">${S.planDurum==='adaylar_hazir'?'Adayları karşılaştır':'Plana git'}</button>
          <button class="btn" id="pl2">Geçmiş planlar</button>
        </div>
      </div></div>

    <div class="card"><div class="hd"><h3>Bekleyen işler</h3></div>
      <div class="bd" style="padding:0">
        ${[
          {t:`${talepBek} izin talebi onay bekliyor`,s:'İzinler ekranında etki analiziyle',r:'izinler',ic:'◔',k:'warn'},
          {t:'3 çalışanın sözleşmesi 30 gün içinde bitiyor',s:'Sezonluk kadro — planı etkileyebilir',r:'calisanlar',ic:'☰',k:''},
          {t:'Geçen haftanın gerçekleşen verisi yüklendi',s:'Uyum skoru %94,2 — realizasyon raporuna bak',r:'realizasyon',ic:'◑',k:'ok'},
          {t:'Cumartesi 22:00 sonrası kapsama sınırda',s:'Ön kontrol uyarısı',r:'talep',ic:'◈',k:'warn'},
        ].map(x=>`<div class="wi" data-r="${x.r}" style="display:flex;gap:11px;align-items:flex-start;padding:11px 16px;border-bottom:1px solid var(--line);cursor:pointer">
            <span class="tag ${x.k}" style="margin-top:2px">${x.ic}</span>
            <div><div style="font-weight:500;font-size:.85rem">${x.t}</div>
              <div style="font-size:.76rem;color:var(--muted)">${x.s}</div></div></div>`).join('')}
      </div></div>
  </div>

  <div class="card" style="margin-top:14px"><div class="hd"><h3>Haftalık kapsama — planlanan vs gereken</h3>
    <span style="font-size:.75rem;color:var(--muted)">tüm ekipler toplamı</span></div>
    <div class="bd">${kapsamaGrafik(PLANLAR[S.secili||'DENGELI'])}</div></div>
  </div>`;

  $('#pl1').onclick=()=>S.planDurum==='adaylar_hazir'?git('karsilastir'):git('editor');
  $('#pl2').onclick=()=>git('gecmis');
  $$('.wi',v).forEach(n=>n.onclick=()=>git(n.dataset.r));
};

function kapsamaGrafik(plan){
  const d=kapsamaHesap(plan.atamalar);
  let out='<div style="display:grid;grid-template-columns:repeat(7,1fr);gap:10px">';
  for(let g=0;g<7;g++){
    let bars='';
    for(let s=8;s<24;s++){
      let olan=0,ger=0;
      EKIPLER.forEach(t=>{olan+=d[`${t.id}|${g}|${s}`]||0; ger+=talepAl(t.id,g,s).hedef;});
      const max=28;
      const ho=Math.min(100,olan/max*100), hg=Math.min(100,ger/max*100);
      const renk = olan>=ger?'var(--brand)':(olan>=ger*0.85?'var(--warn)':'var(--crit)');
      bars+=`<div style="flex:1;position:relative;height:56px;display:flex;align-items:flex-end" title="${GUNK[g]} ${pad(s)}:00 — ${olan}/${ger}">
        <div style="position:absolute;bottom:0;width:100%;height:${hg}%;background:var(--surface-4);border-radius:1px"></div>
        <div style="position:relative;width:100%;height:${ho}%;background:${renk};border-radius:1px"></div></div>`;
    }
    out+=`<div><div style="display:flex;gap:1px;align-items:flex-end">${bars}</div>
      <div style="text-align:center;font-size:.7rem;color:var(--muted);margin-top:5px;font-weight:600">${GUNK[g]}</div></div>`;
  }
  out+='</div><div class="row" style="margin-top:10px;font-size:.72rem;color:var(--muted)">'+
    '<span><span style="display:inline-block;width:9px;height:9px;background:var(--brand);border-radius:2px"></span> planlanan</span>'+
    '<span><span style="display:inline-block;width:9px;height:9px;background:var(--surface-4);border-radius:2px"></span> hedef</span>'+
    '<span><span style="display:inline-block;width:9px;height:9px;background:var(--crit);border-radius:2px"></span> yetersiz</span>'+
    '<span style="margin-left:auto">08:00–24:00 · her çubuk bir saat</span></div>';
  return out;
}

/* ==========================================================================
   EKRAN — Planlar listesi
   ========================================================================== */
EKRANLAR.planlar=(v,top)=>{
  top.innerHTML=''; const b=el('button','btn p','+ Yeni plan'); b.onclick=planSihirbaz; top.appendChild(b);
  const satirlar=[
    {h:HAFTA_BAS,d:S.planDurum,k:PLANLAR[S.secili||'DENGELI'].metrik.hedef,ih:0,ki:'Murat Kaya'},
    {h:gunEkle(HAFTA_BAS,-7),d:'yayinda',k:98.8,ih:0,ki:'Murat Kaya'},
    {h:gunEkle(HAFTA_BAS,-14),d:'yayinda',k:99.1,ih:0,ki:'Murat Kaya'},
    {h:gunEkle(HAFTA_BAS,-21),d:'yayinda',k:97.4,ih:0,ki:'Selin Arslan'},
    {h:gunEkle(HAFTA_BAS,-28),d:'arsiv',k:99.3,ih:0,ki:'Murat Kaya'},
  ];
  const rozet={taslak:'tag',adaylar_hazir:'tag warn',secildi:'tag brand',onayda:'tag warn',onayli:'tag ok',yayinda:'tag ok',arsiv:'tag'};
  const ad={taslak:'taslak',adaylar_hazir:'adaylar hazır',secildi:'seçildi',onayda:'onayda',onayli:'onaylı',yayinda:'yayında',arsiv:'arşiv'};
  v.innerHTML=`<div class="wrap">
    <div class="row" style="margin-bottom:14px">
      <input type="text" placeholder="Ara…" style="max-width:210px">
      <select style="max-width:180px"><option>Tüm departmanlar</option><option>Çağrı Merkezi Operasyon</option></select>
      <select style="max-width:150px"><option>Tüm durumlar</option><option>Yayında</option><option>Onayda</option></select>
    </div>
    <div class="tbl-w"><table class="t"><thead><tr>
      <th>Hafta</th><th>Departman</th><th>Durum</th><th>Kapsama ${Q('HEDEF_KAPSAMA')}</th><th>Sert ihlal</th><th>Oluşturan</th><th></th>
    </tr></thead><tbody>${satirlar.map((r,i)=>`<tr class="clk" data-i="${i}">
      <td class="s">${tarihKisa(r.h)} – ${tarihKisa(gunEkle(r.h,6))}<div style="font-size:.72rem;color:var(--muted)">${r.h.getFullYear()}</div></td>
      <td>Çağrı Merkezi Operasyon</td>
      <td><span class="${rozet[r.d]}">${ad[r.d]}</span></td>
      <td class="n">%${dec(r.k)}</td>
      <td class="n" style="color:var(--ok)">${r.ih}</td>
      <td>${r.ki}</td>
      <td style="text-align:right"><span style="color:var(--muted)">›</span></td></tr>`).join('')}
    </tbody></table></div>
    <div class="note">Satıra tıklayınca duruma göre yönlendirir: <b>adaylar hazır</b> → karşılaştırma ekranı,
      diğerleri → editör (yetki yoksa salt-okunur).</div>
  </div>`;
  $$('tr.clk',v).forEach(tr=>tr.onclick=()=>{
    const i=+tr.dataset.i;
    if(i===0) S.planDurum==='adaylar_hazir'?git('karsilastir'):git('editor');
    else git('gecmis');
  });
};
</script>
<script>
/* ==========================================================================
   Plan oluşturma sihirbazı
   ========================================================================== */
function planSihirbaz(){
  let adim=1;
  const g=el('div');
  const ciz1=()=>{
    if(adim===1){
      g.innerHTML=`<div style="font-size:.74rem;font-weight:600;color:var(--brand);letter-spacing:.1em;margin-bottom:12px">ADIM 1 / 3 · KAPSAM</div>
      <div class="f2">
        <label class="f"><span class="lb">Departman / Şube</span><select><option>Çağrı Merkezi Operasyon</option></select></label>
        <label class="f"><span class="lb">Hafta</span><select><option>12 – 18 Ekim 2026</option><option>19 – 25 Ekim 2026</option></select></label>
      </div>
      <label class="f"><span class="lb">Talep kaynağı</span><select>
        <option>Çağrı hacminden hesapla (Erlang C) — mevcut profil</option>
        <option>Doğrudan kişi sayısı</option><option>Geçmiş veriden öğren</option></select>
        <span class="hint">Talep verisi olmayan müşteri "doğrudan kişi sayısı" ile de ilerleyebilir.</span></label>
      <label class="f"><span class="lb">Süre bütçesi</span><select><option>15 dakika (önerilen)</option><option>5 dakika</option><option>60 saniye</option></select>
        <span class="hint">Plan arka planda üretilir; ekranı kapatabilirsiniz, bittiğinde bildirim gelir.</span></label>`;
    } else if(adim===2){
      g.innerHTML=`<div style="font-size:.74rem;font-weight:600;color:var(--brand);letter-spacing:.1em;margin-bottom:12px">ADIM 2 / 3 · ÖN KONTROL</div>
      <p style="font-size:.85rem;color:var(--muted)">Sistem plan üretmeden önce kadroyu ve talebi kontrol etti. Uyarılar engel değildir.</p>
      ${[
        ['warn','3 çalışanın sözleşmesi bu hafta bitiyor','Sezonluk kadro: A4137, A4198, A4251. Bitiş sonrası günlere atama yapılmayacak.'],
        ['warn','5 izin talebi onay bekliyor','Onaylanmazsa plana dâhil edilmeyecek. İzinler ekranından etkileri görülebilir.'],
        ['ok','Kapasite yeterli','Toplam talep 4.180 saat · kullanılabilir kapasite 5.240 saat. Rahat.'],
        ['crit','Cumartesi 22:00–24:00 · Teknik Destek','Asgari 3 kişi gerekiyor, gece çalışabilecek uygun 2 kişi var. Plan bu saatte açık verebilir.'],
      ].map(([k,t,s])=>`<div class="note ${k==='ok'?'':k}" style="margin:9px 0">
        <b>${t}</b><div style="font-size:.8rem;margin-top:2px">${s}</div></div>`).join('')}`;
    } else {
      g.innerHTML=`<div style="font-size:.74rem;font-weight:600;color:var(--brand);letter-spacing:.1em;margin-bottom:14px">ADIM 3 / 3 · ÜRETİM</div>
      <div id="prog" style="text-align:center;padding:14px 0 6px">
        <div style="font-size:.9rem;font-weight:600;margin-bottom:14px" id="pmsg">Model kuruluyor…</div>
        <div style="height:6px;background:var(--surface-4);border-radius:3px;overflow:hidden">
          <div id="pbar" style="height:100%;width:4%;background:var(--brand);transition:width .5s"></div></div>
        <div class="mono" style="font-size:.75rem;color:var(--muted);margin-top:9px" id="ptxt">0 / 3 profil</div>
      </div>`;
      const asamalar=[['Model kuruluyor…','0 / 3 profil',18],['Dengeli profil çözülüyor…','1 / 3 profil',44],
        ['Kapsama odaklı profil çözülüyor…','2 / 3 profil',70],['Çalışan odaklı profil çözülüyor…','3 / 3 profil',90],
        ['Bağımsız denetleyici planları kontrol ediyor…','sert ihlal: 0',100]];
      let i=0;
      const tk=setInterval(()=>{
        if(i>=asamalar.length){ clearInterval(tk); kapatModal();
          S.planDurum='adaylar_hazir'; toast('Plan üretildi — <b>3 aday hazır</b>',{uzun:true}); git('karsilastir'); return; }
        const [m,t,p]=asamalar[i++];
        $('#pmsg').textContent=m; $('#ptxt').textContent=t; $('#pbar').style.width=p+'%';
      },780);
    }
    // butonları güncelle
    const mf=$('#modal-host .mf'); if(!mf) return;
    mf.innerHTML='';
    if(adim<3){
      const solB=el('button','btn', adim===1?'İptal':'Geri');
      solB.onclick=()=>{ if(adim===1) kapatModal(); else {adim--;ciz1();} };
      const sagB=el('button','btn p', adim===1?'Devam →':'Planı üret');
      sagB.onclick=()=>{ adim++; ciz1(); };
      const bosluk=el('div'); bosluk.style.flex='1';
      mf.append(bosluk,solB,sagB);
    }
  };

let KRS_SEKME='gun';
EKRANLAR.karsilastir=(v,top)=>{
  top.innerHTML=`<span style="font-size:.8rem;color:var(--muted)">${tarihKisa(HAFTA_BAS)} – ${tarihKisa(gunEkle(HAFTA_BAS,6))}</span>`;

  v.innerHTML=`<div class="wrap">

    <div class="grid g3" style="margin:16px 0 20px">
      ${prs.map(p=>{const m=PLANLAR[p].metrik; const on=p===sec;
        return `<div class="card kart" data-p="${p}" style="cursor:pointer;${on?'border-color:var(--brand);box-shadow:0 0 0 2px var(--brand-soft)':''}">
        <div class="hd" style="display:block;padding:14px 16px 10px">
          <div class="row" style="gap:7px"><h3>${PROFIL_BILGI[p].ad}</h3>${on?'<span class="tag brand">seçili</span>':''}</div>

        <div class="bd" style="padding:12px 16px">
          ${[['Hedef kapsama','HEDEF_KAPSAMA','%'+dec(m.hedef),m.hedef>99?'ok':'warn'],
             ['Fazla mesai','FM',m.fm+' sa',m.fm===0?'ok':(m.fm>25?'crit':'warn')],
             ['Karşılanmayan tercih','TERCIH',m.tercih,m.tercih<15?'ok':'warn'],
             ['Adalet sapması','ADALET',dec(m.adalet,2),m.adalet<1.5?'ok':'warn'],
             ['Optimuma uzaklık','GAP','%'+dec(m.gap,2),'ok']]
            .map(([a,k,val,d])=>`<div style="display:flex;align-items:center;gap:6px;padding:5px 0;border-bottom:1px solid var(--line)">
              <span style="font-size:.79rem;color:var(--muted);flex:1">${a}</span>${Q(k)}
              <span class="mono" style="font-weight:600;font-size:.88rem;color:var(--${d})">${val}</span></div>`).join('')}
          <div style="display:flex;align-items:center;gap:6px;padding:7px 0 3px">
            <span style="font-size:.79rem;color:var(--muted);flex:1">Sert kural ihlali</span>
            <span class="tag ok">0 ✓</span></div>
        </div>
        <div style="padding:0 16px 14px"><button class="btn ${on?'':'p'} sec" data-p="${p}" style="width:100%">
          ${on?'Seçildi ✓':'Bu planı seç'}</button></div></div>`;}).join('')}
    </div>

    <div class="tabs" id="krsTabs">
      <button data-t="gun" class="${KRS_SEKME==='gun'?'on':''}">Gün gün</button>
      <button data-t="calisan" class="${KRS_SEKME==='calisan'?'on':''}">Çalışan bazlı</button>
      <button data-t="isi" class="${KRS_SEKME==='isi'?'on':''}">Saatlik kapsama</button>
