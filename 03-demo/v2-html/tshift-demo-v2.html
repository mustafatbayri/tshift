  </div>`;

  $$('.kart',v).forEach(k=>k.onclick=e=>{ if(e.target.closest('.sec'))return; S.secili=k.dataset.p; git('karsilastir'); });
  $$('.sec',v).forEach(b=>b.onclick=e=>{ e.stopPropagation(); S.secili=b.dataset.p;
    if(S.planDurum==='adaylar_hazir') S.planDurum='secildi';
    editorHazirla(); toast(`<b>${PROFIL_BILGI[b.dataset.p].ad}</b> planı seçildi — editöre geçiliyor`); git('editor'); });
  $$('#krsTabs button',v).forEach(b=>b.onclick=()=>{KRS_SEKME=b.dataset.t;git('karsilastir');});
  krsIcerik($('#krsIcerik'),sec);
};

function krsIcerik(host,sec){
  const P=PLANLAR, pl=P[sec];
  if(KRS_SEKME==='gun'){
    const d=kapsamaHesap(pl.atamalar);
    let rows='';
    for(let g=0;g<7;g++){
      const ats=pl.atamalar.filter(a=>a.gun===g);
      const kisi=new Set(ats.map(a=>a.calisan)).size;
      const saat=ats.reduce((s,a)=>s+(a.bit-a.bas-a.mola/60),0);
      let acik=0,gerek=0;
      EKIPLER.forEach(t=>{for(let s=8;s<24;s++){const q=talepAl(t.id,g,s);gerek+=q.hedef;if((d[`${t.id}|${g}|${s}`]||0)<q.asgari)acik++;}});
      rows+=`<tr><td class="s">${GUNLER[g]}<div style="font-size:.72rem;color:var(--muted)">${tarihKisa(gunEkle(HAFTA_BAS,g))}</div></td>
        <td class="n">${kisi}</td><td class="n">${dec(saat,0)}</td><td class="n">${ats.filter(a=>a.bit>=22).length}</td>
        <td class="n">${acik?`<span style="color:var(--crit)">${acik}</span>`:'<span style="color:var(--ok)">0</span>'}</td>
        <td>${acik>2?'<span class="tag warn">kapsama sınırda</span>':(g>=5?'<span class="tag">hafta sonu</span>':'<span class="tag ok">sorunsuz</span>')}</td></tr>`;
    }
    host.innerHTML=`<div class="tbl-w"><table class="t"><thead><tr><th>Gün</th><th>Sahada kişi</th><th>Toplam saat</th>
      <th>Gece vardiyası</th><th>Açık saat</th><th>Durum</th></tr></thead><tbody>${rows}</tbody></table></div>`;
  }
  else if(KRS_SEKME==='calisan'){
    const list=AKTIF.slice(0,40);
    host.innerHTML=`<div class="tbl-w" style="max-height:520px"><table class="t"><thead><tr>
      <th>Çalışan</th><th>Ekip</th><th>Sözleşme</th><th>Planlanan saat</th><th>Fark</th><th>Gece</th><th>Hafta sonu</th></tr></thead>
      <tbody>${list.map(c=>{const s=pl.saatler[c.id]||0; const f=s-c.haftalik;
        const hs=pl.atamalar.filter(a=>a.calisan===c.id&&a.gun>=5).length;
        return `<tr><td class="s">${c.tam}<div style="font-size:.72rem;color:var(--muted)" class="mono">${c.sicil}</div></td>
        <td>${ekipAd(c.ekip)}</td><td>${c.sozlesme==='yari_zamanli'?'Yarı zamanlı '+c.haftalik+' sa':'Tam zamanlı'}</td>
        <td class="n">${dec(s,0)}</td>
        <td class="n" style="color:${f>0?'var(--warn)':(f<-6?'var(--crit)':'var(--muted)')}">${f>0?'+':''}${dec(f,0)}</td>
        <td class="n">${pl.geceSay[c.id]||0}</td><td class="n">${hs}</td></tr>`;}).join('')}
      </tbody></table></div><div style="font-size:.75rem;color:var(--muted);margin-top:8px">İlk 40 kişi gösteriliyor · toplam ${AKTIF.length}</div>`;
  }
  else if(KRS_SEKME==='isi'){
    const d=kapsamaHesap(pl.atamalar);
    let out='<div style="overflow-x:auto"><table class="t" style="font-size:.7rem"><thead><tr><th>Ekip / Gün</th>';
    for(let s=8;s<24;s++) out+=`<th style="padding:6px 3px;text-align:center">${pad(s)}</th>`;
    out+='</tr></thead><tbody>';
    EKIPLER.forEach(t=>{
      for(let g=0;g<7;g++){
        out+=`<tr><td class="s" style="white-space:nowrap">${g===0?`<b>${t.kod}</b> · `:'<span style="opacity:.4">·</span> '}${GUNK[g]}</td>`;
        for(let s=8;s<24;s++){
          const q=talepAl(t.id,g,s), v=d[`${t.id}|${g}|${s}`]||0;
          const oran = q.hedef?v/q.hedef:1;
          let bg='var(--surface-3)',fg='var(--muted)';
          if(v<q.asgari){bg='var(--crit-soft)';fg='var(--crit)';}
          else if(oran>=1){bg='var(--ok-soft)';fg='var(--ok)';}
          else if(oran>=0.85){bg='var(--brand-soft)';fg='var(--brand-ink)';}
          else {bg='var(--warn-soft)';fg='var(--warn)';}
          out+=`<td class="mono" style="text-align:center;padding:4px 2px;background:${bg};color:${fg};font-weight:600"
            title="${t.ad} ${GUNLER[g]} ${pad(s)}:00 — olan ${v}, hedef ${q.hedef}, asgari ${q.asgari}">${v}</td>`;
        }
        out+='</tr>';
      }
    });
    out+='</tbody></table></div><div class="row" style="margin-top:9px;font-size:.72rem;color:var(--muted)">'+
      '<span class="tag ok">hedef sağlandı</span><span class="tag brand">hedefe yakın</span>'+
      '<span class="tag warn">hedefin altında</span><span class="tag crit">asgarinin altında</span></div>';
    host.innerHTML=out;
  }
  else {
    // farklar
    const key = p => { const m={}; PLANLAR[p].atamalar.forEach(a=>{ (m[a.calisan]=m[a.calisan]||[]).push(`${GUNK[a.gun]} ${pad(a.bas)}–${pad(a.bit)}`);}); return m; };
    const A=key('DENGELI'),B=key('KAPSAMA'),C=key('CALISAN');
    const farkli=AKTIF.filter(c=>{
      const a=(A[c.id]||[]).join(','),b=(B[c.id]||[]).join(','),k=(C[c.id]||[]).join(',');
      return !(a===b&&b===k);
    }).slice(0,45);
    host.innerHTML=`<div class="note"><b>En çok sorulan soru:</b> "bu planlarda kim için ne değişiyor?"
      Aşağıda yalnız <b>vardiyası üç planda aynı olmayan</b> kişiler var — ${farkli.length} kişi (toplam ${AKTIF.length}).</div>
      <div class="tbl-w" style="max-height:520px;margin-top:12px"><table class="t"><thead><tr>
        <th>Çalışan</th><th>Dengeli</th><th>Kapsama odaklı</th><th>Çalışan odaklı</th></tr></thead>
      <tbody>${farkli.map(c=>`<tr><td class="s" style="white-space:nowrap">${c.tam}<div style="font-size:.72rem;color:var(--muted)">${ekipAd(c.ekip)}</div></td>
        ${[A,B,C].map(M=>`<td style="font-size:.75rem" class="mono">${(M[c.id]||['—']).join('<br>')}</td>`).join('')}</tr>`).join('')}
      </tbody></table></div>`;
  }
}
</script>
<script>
/* ==========================================================================
   EKRAN — Plan editörü
   ========================================================================== */
function editorHazirla(){
  const p=PLANLAR[S.secili||'DENGELI'];
  S.editor.atamalar=p.atamalar.map(a=>({...a}));
  S.editor.gecmis=[];
  S.editor.secim=null;
  // Hafta ortası olay: 4 kişi rapor aldı → planda açık noktalar oluştu.
  // Demoda asistanın çalıştığı hâli göstermek için gerçekçi bir başlangıç durumu.
  OLAY_RAPOR.forEach(o=>{
    const ix=S.editor.atamalar.findIndex(a=>a.calisan===o.calisan&&a.gun===o.gun);
    if(ix>=0) S.editor.atamalar.splice(ix,1);
  });
}
function ed(){ return S.editor; }
function saatToplam(cid){ return ed().atamalar.filter(a=>a.calisan===cid).reduce((s,a)=>s+(a.bit-a.bas-a.mola/60),0); }

function bosluklar(){
  const d=kapsamaHesap(ed().atamalar); const out=[];
  EKIPLER.forEach(t=>{ for(let g=0;g<7;g++){
    let bas=null;
    for(let s=8;s<=24;s++){
      const q=s<24?talepAl(t.id,g,s):{asgari:0};
      const v=d[`${t.id}|${g}|${s}`]||0;
      const eksik=s<24?Math.max(0,q.asgari-v):0;
      if(eksik>0&&bas===null) bas={s,eksik};
      else if((eksik===0||s===24)&&bas!==null){ out.push({ekip:t.id,gun:g,bas:bas.s,bit:s,eksik:bas.eksik}); bas=null; }
    }
  }});
  return out.sort((a,b)=>b.eksik-a.eksik||a.gun-b.gun);
}
function adaylar(b){
  const gunluk=new Set(ed().atamalar.filter(a=>a.gun===b.gun).map(a=>a.calisan));
  return AKTIF.filter(c=>c.ekip===b.ekip&&!gunluk.has(c.id)&&!izinliMi(c.id,b.gun))
    .map(c=>{
      const sb=SABLONLAR.find(s=>s.bas<=b.bas&&s.bit>=b.bit)||SABLONLAR.find(s=>s.bas<=b.bas&&s.bit>b.bas)||SABLONLAR[2];
      const sure=sb.bit-sb.bas-sb.mola/60;
      const once=saatToplam(c.id), sonra=once+sure;
      const tavan=c.sozlesme==='yari_zamanli'?c.haftalik:c.haftalik+10;
      return {c,sb,once,sonra,tavan,uygun:sonra<=tavan&&sure<=c.gunlukAzami};
    })
    .filter(x=>x.uygun)
    .sort((a,b2)=>(a.sonra/a.tavan)-(b2.sonra/b2.tavan))
    .slice(0,3);
}
const YUMUSAK_UYARI=[
  {id:'u1',kisi:'Mert Kaya',kod:'TERCIH_KARSILAMA',metin:'Sabah tercihi karşılanamadı — 3 gün üst üste 12:00 sonrası vardiya aldı.',
   oneri:'Selin Arslan ile Salı vardiyasını takas et',etki:['Mert: sabah tercihi karşılanır','Selin: haftalık saati değişmez']},
  {id:'u2',kisi:'Burak Demir',kod:'SAAT_DENGESI',metin:'Haftalık saati sözleşmesinin 7 saat altında kaldı.',
   oneri:'Perşembe 10:00–18:00 vardiyası ekle',etki:['Burak: 31 → 38 saat','Kapsama Perşembe 15:00–18:00 arası +1']},
  {id:'u3',kisi:'Ekip: Satış & Kurtarma',kod:'EKIP_SUREKLILIGI',metin:'Cuma ekibinin 6 kişisi bu hafta ilk kez birlikte çalışıyor.',
   oneri:'Cuma vardiyasında 2 kişiyi geçen haftaki ekipten seç',etki:['Ekip sürekliliği puanı artar','Kapsama değişmez']},
];

function kayitEkle(tur,ozet,geri){
  ed().gecmis.unshift({id:'g'+Date.now()+Math.random(),tur,ozet,geri,zaman:new Date(),alindi:false});
}
function geriAl(kayit){
  if(kayit.alindi) return;
  kayit.geri(); kayit.alindi=true;
  kayitEkle('geri_al','↩ Geri alındı: '+kayit.ozet,()=>{});
  ed().gecmis[0].alindi=true;
  toast('Geri alındı — <b>'+kayit.ozet+'</b>',{warn:true});
  git('editor');
}

EKRANLAR.editor=(v,top)=>{
  if(!ed().atamalar.length) editorHazirla();
  const E=ed();
  const d=kapsamaHesap(E.atamalar);
  let hT=0,hO=0,acik=0;
  EKIPLER.forEach(t=>{for(let g=0;g<7;g++)for(let s=8;s<24;s++){
    const q=talepAl(t.id,g,s),val=d[`${t.id}|${g}|${s}`]||0; hT+=q.hedef;hO+=Math.min(val,q.hedef); if(val<q.asgari)acik++;}});
  const kapsama=hO/hT*100;
  const toplamSaat=E.atamalar.reduce((s,a)=>s+(a.bit-a.bas-a.mola/60),0);
  const bos=bosluklar();

  top.innerHTML='';
  const bH=el('button','btn sm','◷ Geçmiş ('+E.gecmis.length+')'); bH.onclick=gecmisModal;
  const bK=el('button','btn sm', E.ustAcik?'▲ Başlığı gizle':'▼ Başlığı göster');
  bK.onclick=()=>{E.ustAcik=!E.ustAcik;git('editor');};
  top.append(bH,bK);

  v.className='view flush';
  v.innerHTML=`
  ${E.ustAcik?`<div style="border-bottom:1px solid var(--line);background:var(--surface);padding:12px 20px">
    <div class="row">
      <div><div style="font-size:.75rem;color:var(--muted)">${tarihStr(HAFTA_BAS)} – ${tarihStr(gunEkle(HAFTA_BAS,6))} · Çağrı Merkezi Operasyon</div>
        <div class="row" style="gap:8px;margin-top:2px"><h2>${PROFIL_BILGI[S.secili||'DENGELI'].ad} plan</h2>
        <span class="tag ${S.planDurum==='yayinda'?'ok':(S.planDurum==='onayda'?'warn':'brand')}">${
          {secildi:'düzenlemede',onayda:'onay bekliyor',onayli:'onaylı',yayinda:'yayında'}[S.planDurum]||'düzenlemede'}</span></div></div>
      <div class="sp" style="flex:1"></div>
      <button class="btn" id="edOnay">Onaya gönder</button>
      <button class="btn p" id="edYayin">Yayınla</button>
    </div>
    <div class="row" style="gap:22px;margin-top:11px;padding-top:10px;border-top:1px solid var(--line)">
      ${[['Hedef kapsama','HEDEF_KAPSAMA','%'+dec(kapsama),kapsama>99?'ok':'warn'],
         ['Toplam saat','',dec(toplamSaat,0),''],
         ['Açık saat','',acik,acik?'crit':'ok'],
         ['Sert ihlal','','0','ok'],
         ['Kilitli atama','',E.atamalar.filter(a=>a.kilit).length,'']]
        .map(([a,k,val,c])=>`<div><div style="font-size:.68rem;color:var(--muted);display:flex;gap:4px;align-items:center">${a}${k?Q(k):''}</div>
          <div class="mono" style="font-size:1.05rem;font-weight:600;${c?'color:var(--'+c+')':''}">${val}</div></div>`).join('')}
    </div></div>`:''}

  <div style="display:flex;height:calc(100vh - ${E.ustAcik?250:135}px);overflow:hidden">
    ${E.solAcik?`<div style="width:222px;border-right:1px solid var(--line);background:var(--surface-3);display:flex;flex-direction:column">
      <div style="padding:10px;border-bottom:1px solid var(--line)">
        <div class="row" style="gap:6px;margin-bottom:7px"><b style="font-size:.78rem;flex:1">Çalışanlar</b>
          <button class="btn gh sm" id="solKapa" title="Paneli kapat">◀</button></div>
        <input type="text" id="calAra" placeholder="Ara…" style="font-size:.8rem;padding:5px 8px">
      </div>
      <div style="flex:1;overflow-y:auto" id="calListe"></div></div>`
      :`<button class="btn gh sm" id="solAc" style="align-self:flex-start;margin:8px 4px;writing-mode:vertical-rl">▶ Çalışanlar</button>`}

    <div style="flex:1;display:flex;flex-direction:column;min-width:0;overflow:hidden">
      <div style="padding:8px 14px;border-bottom:1px solid var(--line);background:var(--surface);display:flex;gap:10px;align-items:center;flex-wrap:wrap">
        <div class="seg" id="gorSeg">
          <button data-g="hafta" class="${E.gorunum==='hafta'?'on':''}">Hafta</button>
          <button data-g="gun" class="${E.gorunum==='gun'?'on':''}">Gün</button>
          <button data-g="liste" class="${E.gorunum==='liste'?'on':''}">Liste</button>
        </div>
        ${E.gorunum!=='hafta'?`<div class="seg" id="gunSeg">${GUNK.map((g,i)=>
          `<button data-d="${i}" class="${E.gun===i?'on':''}">${g}</button>`).join('')}</div>`:''}
        <div style="flex:1"></div>
        <span style="font-size:.74rem;color:var(--muted)">${bos.length?`<span style="color:var(--crit)">● ${bos.length} açık nokta</span>`:'<span style="color:var(--ok)">● açık nokta yok</span>'}</span>
      </div>
      <div style="flex:1;overflow:auto;padding:12px" id="takvim"></div>
    </div>

    ${E.sagAcik?`<div style="width:326px;border-left:1px solid var(--line);background:var(--surface-3);display:flex;flex-direction:column">
      <div style="display:flex;border-bottom:1px solid var(--line)">
        <button class="btn gh sm" id="sagKapa" title="Paneli kapat" style="border-radius:0">▶</button>
        <button class="sgT btn gh sm" data-s="asistan" style="flex:1;border-radius:0;${E.sagSekme==='asistan'?'background:var(--brand-soft);color:var(--brand-ink)':''}">Asistan${bos.length?` (${bos.length})`:''}</button>
        <button class="sgT btn gh sm" data-s="detay" style="flex:1;border-radius:0;${E.sagSekme==='detay'?'background:var(--brand-soft);color:var(--brand-ink)':''}">Detay</button>
      </div>
      <div style="flex:1;overflow-y:auto;padding:12px" id="sagIcerik"></div></div>`
      :`<button class="btn gh sm" id="sagAc" style="align-self:flex-start;margin:8px 4px;writing-mode:vertical-rl">◀ Asistan</button>`}
  </div>`;

  // olaylar
  $('#edOnay')&&($('#edOnay').onclick=()=>{S.planDurum='onayda';toast('Plan <b>onaya gönderildi</b> — Murat Kaya\'ya bildirim gitti');git('editor');});
  $('#edYayin')&&($('#edYayin').onclick=()=>yayinModal());
  $('#solKapa')&&($('#solKapa').onclick=()=>{E.solAcik=false;git('editor');});
  $('#solAc')&&($('#solAc').onclick=()=>{E.solAcik=true;git('editor');});
  $('#sagKapa')&&($('#sagKapa').onclick=()=>{E.sagAcik=false;git('editor');});
  $('#sagAc')&&($('#sagAc').onclick=()=>{E.sagAcik=true;git('editor');});
  $$('#gorSeg button',v).forEach(b=>b.onclick=()=>{E.gorunum=b.dataset.g;git('editor');});
  $$('#gunSeg button',v).forEach(b=>b.onclick=()=>{E.gun=+b.dataset.d;git('editor');});
  $$('.sgT',v).forEach(b=>b.onclick=()=>{E.sagSekme=b.dataset.s;git('editor');});
  if(E.solAcik){ calListeCiz(); $('#calAra').oninput=e=>calListeCiz(e.target.value); }
  takvimCiz($('#takvim'));
  if(E.sagAcik) sagPanelCiz($('#sagIcerik'),bos);
};

function calListeCiz(q){
  const host=$('#calListe'); if(!host) return;
  const E=ed();
  const list=AKTIF.filter(c=>!q||c.tam.toLocaleLowerCase('tr').includes(q.toLocaleLowerCase('tr'))||c.sicil.includes(q)).slice(0,60);
  host.innerHTML=list.map(c=>{
    const s=saatToplam(c.id), or=s/c.haftalik;
    return `<div class="cl" data-c="${c.id}" style="padding:7px 11px;border-bottom:1px solid var(--line);cursor:pointer">
      <div style="font-size:.81rem;font-weight:500">${c.tam}${c.lider?' <span class="tag brand" style="font-size:.58rem">TL</span>':''}</div>
      <div style="display:flex;gap:6px;align-items:center;margin-top:2px">
        <span style="font-size:.7rem;color:var(--muted);flex:1">${ekipAd(c.ekip)}</span>
        <span class="mono" style="font-size:.7rem;color:${or>1?'var(--warn)':(or<0.8?'var(--crit)':'var(--muted)')}">${dec(s,0)}/${c.haftalik}</span></div>
      <div style="height:3px;background:var(--surface-4);border-radius:2px;margin-top:4px;overflow:hidden">
        <div style="height:100%;width:${Math.min(100,or*100)}%;background:${or>1?'var(--warn)':'var(--brand)'}"></div></div></div>`;
  }).join('')||'<div class="empty" style="padding:22px;font-size:.8rem">Sonuç yok</div>';
  $$('.cl',host).forEach(n=>n.onclick=()=>{ed().secim={tip:'calisan',id:n.dataset.c};ed().sagSekme='detay';ed().sagAcik=true;git('editor');});
}
</script>
<script>
/* ---------- takvim görünümleri ---------- */
function takvimCiz(host){
  const E=ed();
  if(E.gorunum==='hafta') return haftaGorunum(host);
  if(E.gorunum==='gun') return gunGorunum(host);
  return listeGorunum(host);
}

function haftaGorunum(host){
  const E=ed(), d=kapsamaHesap(E.atamalar);
  let out='<div style="min-width:820px"><div style="display:grid;grid-template-columns:52px repeat(7,1fr);gap:2px">';
  out+='<div></div>'+GUNK.map((g,i)=>`<div style="text-align:center;font-size:.74rem;font-weight:600;padding:4px 0;color:var(--ink-2)">
      ${GUNLER[i].slice(0,3)} <span style="color:var(--muted);font-weight:400">${tarihKisa(gunEkle(HAFTA_BAS,i))}</span></div>`).join('');
  for(let s=8;s<24;s++){
    out+=`<div class="mono" style="font-size:.68rem;color:var(--muted);text-align:right;padding:3px 6px 0 0">${pad(s)}–${pad(s+1)}</div>`;
    for(let g=0;g<7;g++){
      let olan=0,asg=0,hed=0;
      EKIPLER.forEach(t=>{olan+=d[`${t.id}|${g}|${s}`]||0;const q=talepAl(t.id,g,s);asg+=q.asgari;hed+=q.hedef;});
      const yetersiz=olan<asg;
      const oran=hed?Math.min(1,olan/hed):0;
      const bg = yetersiz?'var(--crit-soft)':`color-mix(in srgb, var(--brand-soft) ${Math.round(oran*100)}%, var(--surface))`;
      out+=`<div class="hc" data-g="${g}" data-s="${s}" style="background:${bg};border:1px solid var(--line);border-radius:3px;
        padding:2px 4px;min-height:26px;cursor:pointer;display:flex;align-items:center;justify-content:space-between">
        <span class="mono" style="font-size:.72rem;font-weight:600;color:${yetersiz?'var(--crit)':'var(--ink-2)'}">${olan}</span>
        <span class="mono" style="font-size:.62rem;color:var(--muted-2)">/${hed}</span></div>`;
    }
  }
  out+='</div><div class="row" style="margin-top:12px;font-size:.73rem;color:var(--muted)">'+
    '<span>Hücrede: <b class="mono">sahada olan / hedef</b></span>'+
    '<span class="tag crit">asgarinin altında</span>'+
    '<span style="margin-left:auto">Bir hücreye tıklayın → o saatte kimler var</span></div></div>';
  host.innerHTML=out;
  $$('.hc',host).forEach(c=>c.onclick=()=>saatDetayModal(+c.dataset.g,+c.dataset.s));
}

function gunGorunum(host){
  const E=ed(), g=E.gun;
  const ats=E.atamalar.filter(a=>a.gun===g);
  let out=`<div style="min-width:900px">
    <div class="row" style="margin-bottom:10px"><h3>${GUNLER[g]} · ${tarihStr(gunEkle(HAFTA_BAS,g))}</h3>
      <span class="tag">${new Set(ats.map(a=>a.calisan)).size} kişi sahada</span>
      <span class="tag">${dec(ats.reduce((s,a)=>s+(a.bit-a.bas-a.mola/60),0),0)} saat</span></div>`;
  // saat cetveli
  out+='<div style="display:grid;grid-template-columns:150px 1fr;gap:0 8px;align-items:center;margin-bottom:6px">'+
    '<div></div><div style="display:grid;grid-template-columns:repeat(16,1fr);font-size:.65rem;color:var(--muted)" class="mono">'+
    Array.from({length:16},(_,i)=>`<div style="text-align:center">${pad(i+8)}</div>`).join('')+'</div></div>';
  EKIPLER.forEach(t=>{
    const tAts=ats.filter(a=>a.ekip===t.id);
    if(!tAts.length) return;
    out+=`<div style="margin:12px 0 5px;font-size:.76rem;font-weight:600;color:var(--ink-2);display:flex;gap:7px;align-items:center">
      <span style="width:9px;height:9px;border-radius:2px;background:${t.renk};display:inline-block"></span>${t.ad}
      <span style="color:var(--muted);font-weight:400">${tAts.length} vardiya</span></div>`;
    tAts.sort((a,b)=>a.bas-b.bas||byId[a.calisan].tam.localeCompare(byId[b.calisan].tam,'tr'))
      .slice(0,26).forEach(a=>{
      const c=byId[a.calisan], sb=sablonObj(a.sablon);
      const sol=(a.bas-8)/16*100, gen=(a.bit-a.bas)/16*100;
      const molaSol=(a.bas+Math.floor((a.bit-a.bas)/2)-8)/16*100, molaGen=(a.mola/60)/16*100;
      out+=`<div style="display:grid;grid-template-columns:150px 1fr;gap:0 8px;align-items:center;margin-bottom:3px">
        <div style="font-size:.76rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis" title="${c.tam}">
          ${c.tam}${c.lider?' <span class="tag brand" style="font-size:.55rem">TL</span>':''}</div>
        <div style="position:relative;height:22px;background:var(--surface-3);border-radius:3px">
          <div class="bar" data-a="${a.id}" title="${sb.ad} ${pad(a.bas)}:00–${pad(a.bit)}:00, mola ${a.mola} dk"
            style="position:absolute;left:${sol}%;width:${gen}%;top:0;bottom:0;background:${t.renk};opacity:.85;border-radius:3px;
            cursor:pointer;display:flex;align-items:center;padding:0 6px;color:#fff;font-size:.66rem;font-weight:600;overflow:hidden">
            ${pad(a.bas)}:00–${pad(a.bit)}:00${a.kilit?' 🔒':''}</div>
          <div style="position:absolute;left:${molaSol}%;width:${molaGen}%;top:4px;bottom:4px;background:var(--surface);opacity:.6;border-radius:2px"></div>
        </div></div>`;
    });
    if(tAts.length>26) out+=`<div style="font-size:.73rem;color:var(--muted);padding:4px 0 0 150px">+${tAts.length-26} kişi daha…</div>`;
  });
  // saat özeti
  out+='<div style="margin-top:18px;border-top:1px solid var(--line);padding-top:12px"><h3 style="margin-bottom:8px">Saat saat kapsama</h3>';
  const d=kapsamaHesap(E.atamalar);
  out+='<div style="display:flex;gap:3px;flex-wrap:wrap">';
  for(let s=8;s<24;s++){
    const parts=EKIPLER.map(t=>{const q=talepAl(t.id,g,s),v=d[`${t.id}|${g}|${s}`]||0;
      return {kod:t.kod,v,q,ok:v>=q.asgari};});
    const kotu=parts.some(p=>!p.ok);
    out+=`<div style="border:1px solid ${kotu?'var(--crit)':'var(--line)'};border-radius:4px;padding:5px 7px;background:${kotu?'var(--crit-soft)':'var(--surface)'}">
      <div class="mono" style="font-size:.68rem;font-weight:600;margin-bottom:2px">${pad(s)}:00</div>
      ${parts.map(p=>`<div class="mono" style="font-size:.63rem;color:${p.ok?'var(--muted)':'var(--crit)'}">${p.kod} ${p.v}/${p.q.asgari}${p.ok?' ✓':' ⚠'}</div>`).join('')}</div>`;
  }
  out+='</div></div></div>';
  host.innerHTML=out;
  $$('.bar',host).forEach(b=>b.onclick=()=>{ed().secim={tip:'atama',id:b.dataset.a};ed().sagSekme='detay';ed().sagAcik=true;git('editor');});
}

function listeGorunum(host){
  const E=ed(), g=E.gun;
  const ats=E.atamalar.filter(a=>a.gun===g)
    .sort((a,b)=>a.ekip.localeCompare(b.ekip)||a.bas-b.bas||byId[a.calisan].tam.localeCompare(byId[b.calisan].tam,'tr'));
  host.innerHTML=`<div class="row" style="margin-bottom:10px"><h3>${GUNLER[g]} · ${tarihStr(gunEkle(HAFTA_BAS,g))}</h3>
      <span class="tag">${ats.length} vardiya</span>
      <div style="flex:1"></div><button class="btn sm">Excel'e aktar</button></div>
    <div class="tbl-w"><table class="t"><thead><tr>
      <th>Çalışan</th><th>Sicil</th><th>Ekip</th><th>Vardiya</th><th>Saat</th><th>Süre</th><th>Mola</th><th>Rol</th><th>Durum</th><th></th>
    </tr></thead><tbody>${ats.map(a=>{const c=byId[a.calisan],sb=sablonObj(a.sablon);
      return `<tr><td class="s">${c.tam}</td><td class="mono" style="font-size:.75rem">${c.sicil}</td>
      <td>${ekipAd(a.ekip)}</td><td>${sb.ad}</td>
      <td class="mono">${pad(a.bas)}:00–${pad(a.bit)}:00</td>
      <td class="n">${dec(a.bit-a.bas-a.mola/60,1)} sa</td>
      <td class="mono" style="font-size:.75rem">${a.mola} dk</td>
      <td>${c.lider?'<span class="tag brand">Takım lideri</span>':'—'}</td>
      <td>${a.kilit?'<span class="tag">🔒 kilitli</span>':'<span class="tag ok">✓</span>'}</td>
      <td style="text-align:right"><button class="btn gh sm sil" data-a="${a.id}">Kaldır</button></td></tr>`;}).join('')}
    </tbody></table></div>
    <div class="note">Müdürün "bugün kim var?" sorusunun en hızlı cevabı bu ekran. Sıralanabilir, filtrelenebilir, dışa aktarılabilir.</div>`;
  $$('.sil',host).forEach(b=>b.onclick=()=>atamaKaldir(b.dataset.a));
}

function atamaKaldir(aid){
  const E=ed(); const ix=E.atamalar.findIndex(a=>a.id===aid); if(ix<0)return;
  const a=E.atamalar[ix], c=byId[a.calisan];
  E.atamalar.splice(ix,1);
  const ozet=`${c.tam} · ${GUNK[a.gun]} ${pad(a.bas)}:00–${pad(a.bit)}:00 kaldırıldı`;
  kayitEkle('sil',ozet,()=>{E.atamalar.push(a);});
  const kayit=E.gecmis[0];
  toast('✓ '+ozet,{geriAl:()=>geriAl(kayit)});
  git('editor');
}
function saatDetayModal(g,s){
  const ats=ed().atamalar.filter(a=>a.gun===g&&a.bas<=s&&a.bit>s);
  const d=kapsamaHesap(ed().atamalar);
  modal({baslik:`${GUNLER[g]} ${pad(s)}:00 – ${pad(s+1)}:00`,alt:`${ats.length} kişi sahada`,genis:'wide',govde:`
    <div class="grid g3" style="margin-bottom:14px">
      ${EKIPLER.map(t=>{const q=talepAl(t.id,g,s),v=d[`${t.id}|${g}|${s}`]||0;
        return `<div class="stat ${v<q.asgari?'crit':(v>=q.hedef?'ok':'warn')}"><div class="k">${t.ad}</div>
        <div class="v">${v}<span style="font-size:.9rem;color:var(--muted)"> / ${q.hedef}</span></div>
        <div class="s">asgari ${q.asgari}${v<q.asgari?' · <b style="color:var(--crit)">açık</b>':''}</div></div>`;}).join('')}
    </div>
    <div class="tbl-w"><table class="t"><thead><tr><th>Çalışan</th><th>Ekip</th><th>Vardiya</th><th>Rol</th></tr></thead>
    <tbody>${ats.slice(0,30).map(a=>{const c=byId[a.calisan];
      return `<tr><td class="s">${c.tam}</td><td>${ekipAd(a.ekip)}</td>
      <td class="mono">${pad(a.bas)}:00–${pad(a.bit)}:00</td>
      <td>${c.lider?'<span class="tag brand">Takım lideri</span>':'—'}</td></tr>`;}).join('')}</tbody></table></div>
    ${ats.length>30?`<div style="font-size:.76rem;color:var(--muted);margin-top:7px">+${ats.length-30} kişi daha</div>`:''}`,
    aksiyon:[{ad:'Kapat'}]});
}
</script>
<script>
/* ---------- sağ panel: asistan + detay ---------- */
function sagPanelCiz(host,bos){
  const E=ed();
  if(E.sagSekme==='detay'){
    const sc=E.secim;
    if(!sc){ host.innerHTML=`<div class="empty" style="padding:30px 12px"><div class="big">◱</div>
      <div style="font-size:.82rem">Takvimde bir vardiyaya ya da soldaki listeden bir çalışana tıklayın.</div></div>`; return; }
    if(sc.tip==='calisan'){
      const c=byId[sc.id], ats=E.atamalar.filter(a=>a.calisan===c.id).sort((a,b)=>a.gun-b.gun);
      host.innerHTML=`<h3>${c.tam}</h3>
        <div style="font-size:.75rem;color:var(--muted)" class="mono">${c.sicil} · ${ekipAd(c.ekip)}</div>
        <div class="grid g2" style="gap:8px;margin:12px 0">
          <div class="stat" style="padding:9px 11px"><div class="k">Planlanan</div><div class="v" style="font-size:1.1rem">${dec(saatToplam(c.id),0)} sa</div></div>
          <div class="stat" style="padding:9px 11px"><div class="k">Sözleşme</div><div class="v" style="font-size:1.1rem">${c.haftalik} sa</div></div>
        </div>
        <h3 style="font-size:.8rem;margin-bottom:6px">Bu haftaki vardiyaları</h3>
        ${ats.length?ats.map(a=>`<div style="display:flex;gap:8px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line)">
          <span style="font-size:.78rem;font-weight:600;width:32px">${GUNK[a.gun]}</span>
          <span class="mono" style="font-size:.78rem;flex:1">${pad(a.bas)}:00–${pad(a.bit)}:00</span>
          <button class="btn gh sm sil2" data-a="${a.id}">Kaldır</button></div>`).join('')
          :'<div style="font-size:.8rem;color:var(--muted)">Bu hafta vardiyası yok.</div>'}
        <div class="note" style="margin-top:14px;font-size:.78rem">Yetkinlik: ${c.yetkinlikler.length?c.yetkinlikler.map(y=>YETKINLIKLER.find(x=>x.id===y).ad).join(', '):'—'}<br>
          Sözleşme: ${c.sozlesme==='yari_zamanli'?'Yarı zamanlı':'Tam zamanlı'} · günlük azami ${c.gunlukAzami} sa</div>`;
      $$('.sil2',host).forEach(b=>b.onclick=()=>atamaKaldir(b.dataset.a));
    } else {
      const a=E.atamalar.find(x=>x.id===sc.id);
      if(!a){host.innerHTML='<div class="empty" style="padding:26px 12px;font-size:.82rem">Bu atama kaldırıldı.</div>';return;}
      const c=byId[a.calisan], sb=sablonObj(a.sablon);
      host.innerHTML=`<h3>${c.tam}</h3>
        <div style="font-size:.75rem;color:var(--muted)">${GUNLER[a.gun]} · ${ekipAd(a.ekip)}</div>
        <label class="f" style="margin-top:12px"><span class="lb">Vardiya şablonu</span>
          <select>${SABLONLAR.map(s=>`<option ${s.id===a.sablon?'selected':''}>${s.ad} (${pad(s.bas)}:00–${pad(s.bit)}:00)</option>`).join('')}</select></label>
        <div class="f2"><label class="f"><span class="lb">Başlangıç</span><input type="time" value="${pad(a.bas)}:00"></label>
          <label class="f"><span class="lb">Bitiş</span><input type="time" value="${pad(a.bit%24)}:00"></label></div>
        <label class="f"><span class="lb">Mola</span><input type="text" value="${a.mola} dakika"></label>
        <div class="row" style="margin-top:6px">
          <button class="btn sm" id="kilitle">${a.kilit?'🔒 Kilidi aç':'🔓 Kilitle'}</button>
          <button class="btn sm dg" id="kaldir">Kaldır</button></div>
        <div class="note" style="margin-top:14px;font-size:.78rem">Elle yapılan her atama otomatik kilitlenir.
          Motor kilitli atamayı hiçbir işlemde değiştiremez.</div>`;
      $('#kilitle',host).onclick=()=>{a.kilit=!a.kilit;toast(a.kilit?'Atama <b>kilitlendi</b>':'Kilit açıldı');git('editor');};
      $('#kaldir',host).onclick=()=>atamaKaldir(a.id);
    }
    return;
  }
  // asistan
  let out='';
  if(bos.length){
    out+=`<div style="font-size:.7rem;font-weight:700;letter-spacing:.1em;color:var(--crit);margin-bottom:8px">⚠ AÇIK NOKTA (${bos.length})</div>`;
    bos.slice(0,4).forEach((b,bi)=>{
      const t=ekipObj(b.ekip);
      const ads=adaylar(b);
      out+=`<div class="card" style="margin-bottom:10px"><div style="padding:10px 12px;border-bottom:1px solid var(--line)">
        <div style="font-size:.82rem;font-weight:600">${GUNLER[b.gun]} ${pad(b.bas)}:00–${pad(b.bit)}:00</div>
        <div style="font-size:.75rem;color:var(--muted)">${t.ad} · <b style="color:var(--crit)">${b.eksik} kişi eksik</b></div></div>
        <div style="padding:4px 12px 10px">`;
      if(!ads.length) out+='<div style="font-size:.78rem;color:var(--muted);padding:8px 0">Kural ihlal etmeden bu boşluğu kapatabilecek kimse yok. Talep hedefini düşürmeyi ya da izin planını gözden geçirmeyi deneyin.</div>';
      ads.forEach((x,i)=>{
        out+=`<div style="padding:9px 0;border-bottom:${i<ads.length-1?'1px solid var(--line)':'none'}">
          <div style="font-size:.81rem;font-weight:600">Öneri ${i+1} — ${x.c.tam}</div>
          <div style="font-size:.74rem;color:var(--muted);margin:2px 0 6px">
            ${pad(x.sb.bas)}:00–${pad(x.sb.bit)}:00 · haftalık saat ${dec(x.once,0)} → <b>${dec(x.sonra,0)}</b> (sınır ${x.tavan})<br>
            Yeni kural ihlali yok · adalet etkisi ihmal edilebilir</div>
          <button class="btn sm p uygula" data-b="${bi}" data-c="${x.c.id}" data-s="${x.sb.id}" style="width:100%">Uygula</button></div>`;
      });
      out+='</div></div>';
    });
    if(bos.length>4) out+=`<div style="font-size:.75rem;color:var(--muted);margin-bottom:12px">+${bos.length-4} açık nokta daha</div>`;
  } else {
    out+=`<div class="note" style="border-left-color:var(--ok);background:var(--ok-soft);margin-top:0">
      <b>Açık nokta yok.</b> Tüm saatlerde asgari kapsama sağlanıyor.</div>`;
  }
  out+=`<div style="font-size:.7rem;font-weight:700;letter-spacing:.1em;color:var(--warn);margin:16px 0 8px">ⓘ YUMUŞAK UYARI (${YUMUSAK_UYARI.length})</div>`;
  YUMUSAK_UYARI.forEach(u=>{
    out+=`<div class="card" style="margin-bottom:10px"><div style="padding:10px 12px">
      <div style="font-size:.81rem;font-weight:600">${u.kisi}</div>
      <div style="font-size:.75rem;color:var(--ink-2);margin:3px 0 5px">${u.metin}</div>
      <span class="tag warn" style="font-size:.6rem">${u.kod}</span>
      <div style="margin-top:9px;padding-top:9px;border-top:1px solid var(--line)">
        <div style="font-size:.78rem;font-weight:600;color:var(--brand-ink)">Öneri: ${u.oneri}</div>
        <ul style="font-size:.73rem;color:var(--muted);margin:4px 0 8px;padding-left:15px">${u.etki.map(e=>`<li>${e}</li>`).join('')}</ul>
        <button class="btn sm p yum" data-u="${u.id}" style="width:100%">Uygula</button></div></div></div>`;
  });
  out+=`<div class="note" style="font-size:.76rem;margin-top:14px">Her aday <b>bağımsız denetleyiciden</b> geçer.
    Sert kural ihlal eden aday bu listede <b>hiç görünmez</b>. Uygulanan her öneri <b>geri alınabilir</b>.</div>`;
  host.innerHTML=out;

  $$('.uygula',host).forEach(b=>b.onclick=()=>{
    const bo=bos[+b.dataset.b], c=byId[b.dataset.c], sb=sablonObj(b.dataset.s);
    const yeni={id:'a'+Date.now(),calisan:c.id,ekip:bo.ekip,sablon:sb.id,gun:bo.gun,bas:sb.bas,bit:sb.bit,mola:sb.mola,kilit:true,kaynak:'manuel'};
    ed().atamalar.push(yeni);
    const ozet=`${c.tam} · ${GUNK[bo.gun]} ${pad(sb.bas)}:00–${pad(sb.bit)}:00 eklendi (öneri)`;
    kayitEkle('oneri_uygula',ozet,()=>{const i=ed().atamalar.findIndex(a=>a.id===yeni.id);if(i>=0)ed().atamalar.splice(i,1);});
    const kayit=ed().gecmis[0];
    toast('✓ '+ozet,{geriAl:()=>geriAl(kayit)});
    git('editor');
  });
  $$('.yum',host).forEach(b=>b.onclick=()=>{
    const u=YUMUSAK_UYARI.find(x=>x.id===b.dataset.u);
    const ozet=`${u.kisi} · ${u.oneri}`;
    kayitEkle('oneri_uygula',ozet,()=>{});
    const kayit=ed().gecmis[0];
    toast('✓ '+ozet,{geriAl:()=>geriAl(kayit)});
    git('editor');
  });
}

    else if(sekme==='yet') I.innerHTML=`<div class="tbl-w"><table class="t"><thead><tr><th>Yetkinlik</th><th>Seviye</th><th>Sertifika bitişi</th><th></th></tr></thead>

        return `<tr><td class="s">${yy.ad}</td><td class="n">${3+Math.floor(R()*3)}/5</td><td>—</td>
        <td style="text-align:right"><button class="btn gh sm">Kaldır</button></td></tr>`;}).join('')

<script>
/* ==========================================================================
   EKRAN — İzinler + ETKİ ANALİZİ
   ========================================================================== */
function izinEtki(iz){
  const plan = ed().atamalar.length?{atamalar:ed().atamalar}:PLANLAR[S.secili||'DENGELI'];
  const d=kapsamaHesap(plan.atamalar);
  const gunler=[];
  for(let g=0;g<7;g++){
    const t=gunEkle(HAFTA_BAS,g);
    if(t<iz.bas||t>iz.bit) continue;
    const ats=plan.atamalar.filter(a=>a.calisan===iz.calisan&&a.gun===g);
    ats.forEach(a=>{
      const kaps=[];
      for(let s=a.bas;s<a.bit;s++){
        const q=talepAl(a.ekip,g,s), once=d[`${a.ekip}|${g}|${s}`]||0, sonra=once-1;
        kaps.push({saat:s,once,sonra,asgari:q.asgari,hedef:q.hedef,duser:sonra<q.asgari});
      }
      gunler.push({gun:g,tarih:t,atama:a,kaps,rolEtki:byId[iz.calisan].lider?'takım lideri çıkıyor — kontrol edin':'etkilenmiyor'});
    });
  }
  const duser=gunler.some(x=>x.kaps.some(k=>k.duser));
  let ads=[];
  if(duser){
    const gs=gunler.find(x=>x.kaps.some(k=>k.duser));
    const gunluk=new Set(plan.atamalar.filter(a=>a.gun===gs.gun).map(a=>a.calisan));
    const havuz=AKTIF.filter(c=>c.ekip===gs.atama.ekip&&c.id!==iz.calisan&&!izinliMi(c.id,gs.gun));
    ads=havuz.slice(0,6).map(c=>{
      const sure=gs.atama.bit-gs.atama.bas-gs.atama.mola/60;
      const once=plan.atamalar.filter(a=>a.calisan===c.id).reduce((s,a)=>s+(a.bit-a.bas-a.mola/60),0);
      const tavan=c.sozlesme==='yari_zamanli'?c.haftalik:c.haftalik+10;
      const meşgul=gunluk.has(c.id);
      const engel = meşgul?'O gün zaten vardiyası var':((once+sure>tavan)?'Haftalık saat sınırı aşılır ('+dec(once+sure,0)+'>'+tavan+')':
        (sure>c.gunlukAzami?'Günlük azami süreyi aşar':null));
      return {c,once,sonra:once+sure,tavan,engel};
    }).sort((a,b)=>(a.engel?1:0)-(b.engel?1:0)).slice(0,4);
  }
  return {durum: !gunler.length?'etkilemez':(duser?(ads.some(a=>!a.engel)?'etkiler':'kritik'):'etkilemez'), gunler, adaylar:ads};
}
const ETK_ROZET={etkilemez:['tag ok','✓ Planı etkilemez'],etkiler:['tag warn','⚠ Planı etkiler'],kritik:['tag crit','✗ Kritik']};

EKRANLAR.izinler=(v,top)=>{
  top.innerHTML=''; const b=el('button','btn p','+ Yeni izin'); b.onclick=yeniIzinModal; top.appendChild(b);
  const list=[...IZINLER].sort((a,b)=>(a.durum==='talep'?-1:1)-(b.durum==='talep'?-1:1)||a.bas-b.bas);
  v.innerHTML=`<div class="wrap">
    <div class="note"><b>Etki rozeti</b> her satırda hazır durur. Bir izin onaylanmadan önce hangi planı, hangi vardiyayı
      ve hangi saatin kapsamasını etkileyeceği hesaplanır. Sahadaki en sık problem buydu: çalışan izin ister, yönetici
      "olur" der, sonra planın o gün delik olduğu ortaya çıkar.</div>
    <div class="row" style="margin:14px 0">
      <select style="max-width:170px"><option>Tüm durumlar</option><option>Onay bekleyen</option><option>Onaylı</option></select>
      <select style="max-width:190px"><option>Tüm ekipler</option>${EKIPLER.map(e=>`<option>${e.ad}</option>`).join('')}</select>
      <div style="flex:1"></div>
      <span style="font-size:.8rem;color:var(--muted)">${IZINLER.filter(i=>i.durum==='talep').length} talep onay bekliyor</span>
    </div>
    <div class="tbl-w"><table class="t"><thead><tr>
      <th>Çalışan</th><th>Tip</th><th>Tarih</th><th>Gün</th><th>Durum</th><th>Plana etkisi</th><th></th>
    </tr></thead><tbody>${list.map(i=>{const c=byId[i.calisan]; const e=izinEtki(i); const rz=ETK_ROZET[e.durum];
      return `<tr><td class="s">${c.tam}<div style="font-size:.72rem;color:var(--muted)">${ekipAd(c.ekip)}</div></td>
      <td>${{yillik:'Yıllık',mazeret:'Mazeret',rapor:'Rapor',ucretsiz:'Ücretsiz'}[i.tip]}</td>
      <td class="mono" style="font-size:.78rem">${tarihKisa(i.bas)} – ${tarihKisa(i.bit)}</td>
      <td class="n">${i.gun}</td>
      <td><span class="tag ${i.durum==='onayli'?'ok':(i.durum==='talep'?'warn':'')}">${i.durum==='talep'?'onay bekliyor':i.durum}</span></td>
      <td><span class="${rz[0]}">${rz[1]}</span>${e.gunler.length?`<div style="font-size:.7rem;color:var(--muted);margin-top:2px">${e.gunler.length} planlı vardiya</div>`:''}</td>
      <td style="text-align:right;white-space:nowrap">
        ${e.gunler.length?`<button class="btn sm etk" data-i="${i.id}">Etkileri gör</button>`:''}
        ${i.durum==='talep'?`<button class="btn sm p ony" data-i="${i.id}">Onayla</button>`:''}</td></tr>`;}).join('')}
    </tbody></table></div></div>`;
  $$('.etk',v).forEach(b=>b.onclick=()=>etkiModal(IZINLER.find(i=>i.id===b.dataset.i)));
  $$('.ony',v).forEach(b=>b.onclick=()=>{
    const iz=IZINLER.find(i=>i.id===b.dataset.i); const e=izinEtki(iz);
    if(e.gunler.length) etkiModal(iz);
    else { iz.durum='onayli'; toast('İzin <b>onaylandı</b> — planı etkilemiyor'); git('izinler'); }
  });
};

function etkiModal(iz){
  const c=byId[iz.calisan], e=izinEtki(iz);
  const rz=ETK_ROZET[e.durum];
  let govde=`<div class="row" style="margin-bottom:14px">
    <span class="${rz[0]}" style="font-size:.75rem;padding:4px 9px">${rz[1]}</span>
    <span style="font-size:.82rem;color:var(--muted)">${e.gunler.length} planlı vardiya etkileniyor</span></div>`;
  e.gunler.forEach(x=>{
    const dusenler=x.kaps.filter(k=>k.duser);
    govde+=`<div class="card" style="margin-bottom:12px"><div class="hd">
      <h3>${GUNLER[x.gun]} · ${tarihStr(x.tarih)}</h3>
      <span class="tag">${ekipAd(x.atama.ekip)}</span></div><div class="bd" style="padding:12px 16px">
      <div style="display:flex;gap:26px;flex-wrap:wrap;margin-bottom:10px">
        <div><div style="font-size:.7rem;color:var(--muted)">Vardiya</div>
          <div class="mono" style="font-weight:600">${pad(x.atama.bas)}:00–${pad(x.atama.bit)}:00</div></div>
        <div><div style="font-size:.7rem;color:var(--muted)">Rol etkisi</div>
          <div style="font-weight:600;font-size:.85rem;color:${byId[iz.calisan].lider?'var(--warn)':'var(--ok)'}">${x.rolEtki}</div></div>
        <div><div style="font-size:.7rem;color:var(--muted)">Asgarinin altına düşen saat</div>
          <div class="mono" style="font-weight:600;color:${dusenler.length?'var(--crit)':'var(--ok)'}">${dusenler.length}</div></div>
      </div>
      <div style="display:flex;gap:3px;flex-wrap:wrap">${x.kaps.map(k=>`
        <div style="border:1px solid ${k.duser?'var(--crit)':'var(--line)'};background:${k.duser?'var(--crit-soft)':'var(--surface-3)'};
          border-radius:4px;padding:4px 7px;min-width:60px">
          <div class="mono" style="font-size:.66rem;color:var(--muted)">${pad(k.saat)}:00</div>
          <div class="mono" style="font-size:.76rem;font-weight:600;color:${k.duser?'var(--crit)':'var(--ink-2)'}">
            ${k.once} → ${k.sonra}</div>
          <div class="mono" style="font-size:.62rem;color:var(--muted)">asg ${k.asgari}${k.duser?' ⚠':' ✓'}</div></div>`).join('')}</div>
      </div></div>`;
  });
  if(e.adaylar.length){
    govde+=`<h3 style="margin:18px 0 8px">Boşluğu kapatabilecekler</h3>
      <div class="tbl-w"><table class="t"><thead><tr><th>Çalışan</th><th>Haftalık saat</th><th>Durum</th></tr></thead>
      <tbody>${e.adaylar.map(a=>`<tr><td class="s">${a.c.tam}<div style="font-size:.72rem;color:var(--muted)">${ekipAd(a.c.ekip)}</div></td>
        <td class="mono">${dec(a.once,0)} → ${a.engel?'—':`<b>${dec(a.sonra,0)}</b>`} <span style="color:var(--muted)">(sınır ${a.tavan})</span></td>
        <td>${a.engel?`<span class="tag crit">✗ ${a.engel}</span>`:'<span class="tag ok">✓ uygun</span>'}</td></tr>`).join('')}
      </tbody></table></div>`;
  }
  if(e.durum==='kritik') govde+=`<div class="note crit" style="margin-top:14px"><b>Kritik.</b>
    Kapsama asgarinin altına düşüyor ve kural ihlal etmeden bu boşluğu kapatabilecek kimse yok.
    İzni onaylarsanız o saatte açık kalacak.</div>`;

  const uygun=e.adaylar.find(a=>!a.engel);
  const aks=[{ad:'Reddet',tur:'dg',fn:()=>{iz.durum='reddedildi';toast('İzin reddedildi',{warn:true});git('izinler');}},
    {ad:'İzni onayla ve boşluğu bırak',fn:()=>{iz.durum='onayli';
      toast('İzin onaylandı — <b>boşluk asistanda açık nokta olarak görünecek</b>',{warn:true});git('izinler');}}];
  if(uygun) aks.push({ad:`Onayla ve ${uygun.c.ad}'ı ata`,tur:'p',fn:()=>{iz.durum='onayli';
    toast(`İzin onaylandı ve <b>${uygun.c.tam}</b> boşluğa atandı`);git('izinler');}});
  modal({baslik:`${c.tam} · izin etkisi`,alt:`${{yillik:'Yıllık izin',mazeret:'Mazeret izni',rapor:'Rapor',ucretsiz:'Ücretsiz izin'}[iz.tip]} · ${tarihStr(iz.bas)} – ${tarihStr(iz.bit)}`,
    govde,genis:'xwide',aksiyon:aks});
}

function yeniIzinModal(){
  modal({baslik:'Yeni izin',alt:'Kaydetmeden önce plana etkisi hesaplanır',govde:`
    <label class="f"><span class="lb">Çalışan *</span><select>${AKTIF.slice(0,40).map(c=>`<option>${c.tam} — ${c.sicil}</option>`).join('')}</select></label>
    <div class="f2">
      <label class="f"><span class="lb">Tip *</span><select><option>Yıllık izin</option><option>Mazeret</option><option>Rapor</option><option>Ücretsiz</option></select></label>
      <label class="f"><span class="lb">Tüm gün mü</span><select><option>Evet</option><option>Hayır — saat aralığı</option></select></label>
      <label class="f"><span class="lb">Başlangıç *</span><input type="date" value="2026-10-16"></label>
      <label class="f"><span class="lb">Bitiş *</span><input type="date" value="2026-10-17"></label>
    </div>
    <label class="f"><span class="lb">Açıklama</span><textarea placeholder="İsteğe bağlı"></textarea></label>
    <div class="note warn"><b>⚠ Planı etkiler</b><div style="margin-top:3px">2 planlı vardiya · 16 Ekim 09:00–12:00 arası
      Ön Büro kapsaması 4/4 → 3/4 düşer. Kaydettikten sonra "Etkileri gör" ile ayrıntıya bakabilirsiniz.</div></div>`,
    aksiyon:[{ad:'Vazgeç'},{ad:'Kaydet',tur:'p',fn:()=>toast('İzin kaydedildi — <b>onay bekliyor</b>')}]});
}

EKRANLAR.sablonlar=(v,top)=>{

let KURAL_KAT='hepsi';

<script>

let AKT_ADIM=0;

  top.innerHTML='';
  const adimlar=['Dosya seç','Kolon eşleme','Doğrulama','Onay'];
  v.innerHTML=`<div class="wrap">
    <div class="note"><b>Bu akışta yapay zekâ yoktur.</b> Kolon eşleme, doğrulama ve yazma işlerinin tamamını

    <div class="row" style="margin:16px 0 18px">

EKRANLAR.realizasyon=(v,top)=>{
  top.innerHTML=`<input type="date" value="2026-10-09" style="max-width:160px">`;

  const gerc=GERCEKLESEN.filter(x=>x.gun===g);
  const devam=gerc.filter(x=>x.devamsiz).length;
  const planKisi=new Set(gerc.map(x=>x.calisan)).size;
  const planSaat=gerc.reduce((s,x)=>s+(x.plan.bit-x.plan.bas-x.plan.mola/60),0);
  const gercSaat=gerc.reduce((s,x)=>s+(x.devamsiz?0:(x.plan.bit-x.plan.bas-x.plan.mola/60)-(x.gec+x.erken)/60),0);
  const uyum=gercSaat/planSaat*100;
  v.innerHTML=`<div class="wrap">
    <div class="row" style="margin-bottom:14px"><h2>Plan realizasyon raporu</h2>
      <span class="tag">Cuma · 9 Ekim 2026</span><div style="flex:1"></div>

      <div class="stat"><div class="k">Planlanan kişi</div><div class="v">${planKisi}</div></div>
      <div class="stat ${devam>6?'warn':''}"><div class="k">Gelmeyen</div><div class="v">${devam}</div><div class="s">%${dec(devam/planKisi*100)}</div></div>
      <div class="stat"><div class="k">Planlanan / gerçekleşen saat</div><div class="v" style="font-size:1.15rem">${dec(planSaat,0)} / ${dec(gercSaat,0)}</div></div>
      <div class="stat ${uyum>93?'ok':'warn'}"><div class="k">Uyum skoru ${Q('UYUM')}</div><div class="v">%${dec(uyum)}</div></div>
    </div>
    <div class="card" style="margin-bottom:16px"><div class="hd"><h3>Saatlik kapsama — planlanan vs fiilen sahada</h3></div>
      <div class="bd">${realGrafik(g,gerc)}</div></div>
    <div class="card" style="margin-bottom:16px"><div class="hd"><h3>Günün özeti</h3><span class="tag brand">yapay zekâ</span></div>
      <div class="bd"><p style="font-size:.88rem;margin:0">Cuma günü <b>Müşteri Hizmetleri</b> ekibinde sabah vardiyasında
      ${Math.max(2,Math.round(devam*0.4))} kişi gelmedi; 09:00–11:00 arası kapsama hedefin altında kaldı.

        const g1=`${pad(a.bas)}:00–${pad(a.bit)}:00`;
        const g2=x.devamsiz?'—':`${pad(a.bas)}:${pad(x.gec)}–${pad(a.bit-(x.erken?1:0))}:${pad(x.erken?60-x.erken:5)}`;
        const fark=x.devamsiz?-(a.bit-a.bas-a.mola/60)*60:-(x.gec+x.erken);
        return `<tr><td class="s">${c.tam}</td><td>${ekipAd(a.ekip)}</td><td class="mono">${g1}</td>

      </tbody></table></div>

      Bu rapor <b>tarih seçmelidir</b> ve geçmişe dönüktür.</div></div>`;

function realGrafik(g,gerc){
  const plan={},real={};
  for(let s=8;s<24;s++){plan[s]=0;real[s]=0;}
  gerc.forEach(x=>{const a=x.plan; for(let s=a.bas;s<a.bit;s++){plan[s]++; if(!x.devamsiz) real[s]++;}});
  const max=Math.max(...Object.values(plan))||1;
  let out='<div style="display:flex;gap:4px;align-items:flex-end;height:120px">';
  for(let s=8;s<24;s++){
    const hp=plan[s]/max*100, hr=real[s]/max*100;
    out+=`<div style="flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%"
      title="${pad(s)}:00 — planlanan ${plan[s]}, sahada ${real[s]}">
      <div style="width:100%;position:relative;height:${hp}%;background:var(--surface-4);border-radius:2px 2px 0 0">
        <div style="position:absolute;bottom:0;left:0;right:0;height:${plan[s]?real[s]/plan[s]*100:0}%;background:var(--brand);border-radius:2px 2px 0 0"></div></div>
      <div class="mono" style="font-size:.6rem;color:var(--muted);margin-top:4px">${pad(s)}</div></div>`;
  }
  out+='</div><div class="row" style="margin-top:8px;font-size:.73rem;color:var(--muted)">'+
    '<span><span style="display:inline-block;width:9px;height:9px;background:var(--brand);border-radius:2px"></span> fiilen sahada</span>'+
    '<span><span style="display:inline-block;width:9px;height:9px;background:var(--surface-4);border-radius:2px"></span> planlanan</span></div>';
  return out;
}

  top.innerHTML=`<select style="max-width:150px"><option>Son 3 ay</option><option>Bu çeyrek</option></select>`;
  const hf=['H1','H2','H3','H4','H5','H6','H7','H8','H9','H10','H11','H12'];

  const fm=hf.map(()=>Math.round(R()*40));
  v.innerHTML=`<div class="wrap">
    <div class="grid g2">
      <div class="card"><div class="hd"><h3>Kapsama trendi ${Q('HEDEF_KAPSAMA')}</h3></div><div class="bd">
        ${cizgiGrafik(kaps,hf,'%',94,100)}</div></div>
      <div class="card"><div class="hd"><h3>Fazla mesai trendi ${Q('FM')}</h3></div><div class="bd">
        ${cizgiGrafik(fm,hf,' sa',0,45)}</div></div>
    </div>
    <div class="card" style="margin-top:14px"><div class="hd"><h3>Adalet dağılımı — kişi başına gece vardiyası ${Q('ADALET')}</h3></div>
      <div class="bd">${dagilimGrafik()}</div></div>

      <div class="stat ok"><div class="k">Plan kararlılığı ${Q('KARARLILIK')}</div><div class="v">%91</div><div class="s">gereksiz değişim önlendi</div></div>
      <div class="stat warn"><div class="k">Devamsızlık</div><div class="v">%3,4</div><div class="s">en yoğun: Cuma sabah</div></div>
    </div></div>`;
};
function cizgiGrafik(vals,etiket,birim,min,max){
  const w=100,hgt=54;
  const pts=vals.map((val,i)=>[i/(vals.length-1)*w,hgt-(val-min)/(max-min)*hgt]);
  const f=x=>x.toFixed(1);
  const d=pts.map((p,i)=>(i?'L':'M')+f(p[0])+' '+f(p[1])).join(' ');
  const alan=d+` L ${w} ${hgt} L 0 ${hgt} Z`;
  return `<svg viewBox="-2 -6 ${w+4} ${hgt+22}" style="width:100%;height:120px" role="img" aria-label="trend">
    <path d="${alan}" fill="var(--brand-soft)"/>
    <path d="${d}" fill="none" stroke="var(--brand)" stroke-width="1.4" stroke-linejoin="round"/>
    ${pts.map((p,i)=>`<circle cx="${f(p[0])}" cy="${f(p[1])}" r="${i===pts.length-1?1.9:1.1}"
      fill="${i===pts.length-1?'var(--brand)':'var(--surface)'}" stroke="var(--brand)" stroke-width="1"/>`).join('')}
    <text x="0" y="${hgt+12}" font-size="4.4" fill="var(--muted)">${etiket[0]}</text>
    <text x="${w}" y="${hgt+12}" font-size="4.4" fill="var(--muted)" text-anchor="end">${etiket[etiket.length-1]}</text>
    <text x="${w}" y="-1" font-size="5" fill="var(--brand)" text-anchor="end" font-weight="600">${dec(vals[vals.length-1],1)}${birim}</text>
  </svg>`;
}
function dagilimGrafik(){
  const kova=[0,0,0,0,0,0];
  AKTIF.forEach(c=>{const g=Math.min(5,PLANLAR.DENGELI.geceSay[c.id]||0); kova[g]++;});
  const max=Math.max(...kova);
  return `<div style="display:flex;gap:8px;align-items:flex-end;height:110px">
    ${kova.map((n,i)=>`<div style="flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%">
      <div class="mono" style="font-size:.7rem;color:var(--muted);margin-bottom:3px">${n}</div>
      <div style="width:100%;height:${n/max*100}%;background:var(--brand);opacity:${.45+i*.11};border-radius:3px 3px 0 0"></div>
      <div style="font-size:.7rem;color:var(--muted);margin-top:5px">${i===5?'5+':i} gece</div></div>`).join('')}
  </div><div style="font-size:.76rem;color:var(--muted);margin-top:8px">Sağa doğru kayan bir dağılım dengesizlik demektir.
    Aylık pencerede devir yükü bu dağılımı düzeltir.</div>`;
}
