# TShift — altyapi
#
# GELISTIRME (gunluk kullanim, degismedi):
#   docker compose up -d          Yalniz veritabani. API ve arayuz makinede calisir.
#   docker compose down           Durdur, veri kalir
#   docker compose down -v        SIFIRLA, veritabanini tamamen siler
#
# INCELEME (her sey kutuda, tek komut):
#   docker compose --profile tam up --build
#   -> http://localhost:3000     firma: anadolu-cm  parola: TShift2026!Deneme
#
# Ikinci kip .NET SDK ve Node kurulumu gerektirmez; yalniz Docker yeter.
# Ilk acilista sema, guvenlik betikleri ve ornek veri kendiliginden kurulur.

services:
  db:
    image: postgres:17-alpine
    container_name: tshift-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: tshift
      POSTGRES_USER: tshift
      POSTGRES_PASSWORD: ${DB_PASSWORD:?.env dosyasi yok ya da DB_PASSWORD bos -- bkz T-34}
      TZ: Europe/Istanbul
      PGTZ: Europe/Istanbul
    ports:
      # Sol taraf senin bilgisayarindaki numara. 5433 sectik ki daha once
      # kurulmus bir PostgreSQL varsa cakismasin.
      - "5433:5432"
    volumes:
      - tshift-db-data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tshift -d tshift"]
      interval: 5s
      timeout: 3s
      retries: 12
    networks: [tshift]

  # ---- Asagidakiler yalniz "--profile tam" ile calisir ----------------------
  # Gunluk gelistirmede API ve arayuz makinede calisiyor: derleme daha hizli,
  # hata ayiklama mumkun. Kutular inceleme ve ilerde yayina cikis icin.

  api:
    profiles: ["tam"]
    build:
      # Baglam 04-kod: kutu icine hem backend hem db/rls giriyor.
      context: .
      dockerfile: backend/Dockerfile
    container_name: tshift-api
    restart: unless-stopped
    environment:
      # Uygulama KISITLI rolle baglanir. Super kullaniciyla baglanmak
      # RLS'i tamamen devre disi birakir - bkz. db/rls/02-uygulama-rolu.sql
      ConnectionStrings__TShift: "Host=db;Port=5432;Database=tshift;Username=tshift_app;Password={APP_DB_PASSWORD}"
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?.env dosyasi yok ya da APP_DB_PASSWORD bos -- bkz T-34}

      # Kurulum SAHIBI rolle calisir: migration ve yetki betikleri icin gerekli.
      # AYRI bir degisken olmasi kasitli - ikisi karisirsa uygulama super
      # kullaniciyla baglanir ve guvenlik sessizce kaybolur.
      TSHIFT_SAHIP_BAGLANTI: "Host=db;Port=5432;Database=tshift;Username=tshift;Password={DB_PASSWORD}"
      DB_PASSWORD: ${DB_PASSWORD:?.env dosyasi yok ya da DB_PASSWORD bos -- bkz T-34}

      # DIKKAT: acilista migration + guvenlik betikleri + ornek veri calistirir.
      # CANLIDA ASLA "true" OLMAZ. Bkz. KurulumHizmeti.cs
      TSHIFT_KURULUM: "true"

      # Yerel gelistirme anahtari. Canlida mutlaka disaridan verilir.
      JWT_SECRET: ${JWT_SECRET:?.env dosyasi yok ya da JWT_SECRET bos -- bkz T-34}

      # T-35: X-Forwarded-For basligi YALNIZ bu adresten geldiginde okunur.
      # Liste bossa baslik hic okunmaz (guvenli varsayilan).
      #
      # TEK ADRES, ARALIK DEGIL -- ve bunun bedeli olculerek ogrenildi.
      # Ilk yazimda buraya 172.16.0.0/12 kondu ve yanina "host'tan gelen
      # istek bu araliga girmez" diye yazildi. OLCULDU, YANLISTI:
      #
      #   host -> yayinlanmis port -> api kutusu  =>  ::ffff:172.18.0.1
      #                                               (docker AG GECIDI)
      #   web kutusu                              =>  172.18.0.4
      #
      # Ikisi de /12'nin icinde. Yani aralik, ag gecidini -- dolayisiyla
      # host'taki her seyi -- guvenilir sayiyordu ve sahte baslik geciyordu.
      # Elle yapilan uctan uca deneme bunu yakaladi; birim testi yakalayamaz,
      # cunku yanlis olan kod degil YAPILANDIRMA.
      #
      # Cozum: web kutusuna sabit adres verip YALNIZ onu guvenmek.
      # Bu bir SIR DEGIL, topoloji bilgisi. Barindirma karari verilince
      # yuk dengeleyicinin adresiyle degistirilecek.
      TSHIFT_GUVENILEN_VEKILLER: ${TSHIFT_GUVENILEN_VEKILLER:-172.28.9.10}

      # Development DEGIL. Sebep: gelistirme kipinde EF "sensitive data logging"
      # aciliyor ve sorgu parametreleri kayda yaziliyor - iclerinde e-posta,
      # jeton ozeti, parola ozeti gecebilir. Inceleme kutusu yerelde calissa da
      # bu kotu bir varsayilan. Uygulama Production kipinde calisir; gelistirme
      # uclari TSHIFT_KURULUM bayragiyla ayrica aciliyor.
      ASPNETCORE_ENVIRONMENT: Production

      # SQL cumlelerini kayda basma. Gurultulu bir kayit okunmayan kayittir;
      # okunmayan kayit da olmayan kayitla aynidir.
      Logging__LogLevel__Microsoft.EntityFrameworkCore.Database.Command: Warning
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "5146:8080"
    networks: [tshift]

  web:
    profiles: ["tam"]
    build:
      context: ./frontend
    container_name: tshift-web
    restart: unless-stopped
    environment:
      # Kutular arasi adres: tarayicinin gordugu localhost degil, ag icindeki ad.
      # Zaten tarayici API'ye hic gitmiyor; istekleri Next sunucusu tasiyor.
      TSHIFT_API: "http://api:8080"
    depends_on:
      - api
    ports:
      - "3000:3000"
    networks:
      tshift:
        # SABIT adres. api kutusu X-Forwarded-For basligini YALNIZ bu
        # adresten kabul ediyor; adres her acilista degisseydi liste
        # tutmazdi. Bkz. TSHIFT_GUVENILEN_VEKILLER.
        ipv4_address: 172.28.9.10

networks:
  # Alt ag ACIKCA veriliyor: sabit adres verebilmek icin sart, ve boylece
  # "hangi araliktayiz" sorusu docker'in kararina birakilmiyor.
  tshift:
    name: tshift-ag
    ipam:
      config:
        - subnet: 172.28.9.0/24

volumes:
  tshift-db-data:
    name: tshift-db-data
